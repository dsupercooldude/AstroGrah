    // Cryptographic Base64 & Hashing
    const CryptoUtils = {
        b64EncodeUnicode: (str) => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))),
        b64DecodeUnicode: (str) => decodeURIComponent(atob(str).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')),
        encrypt: (data) => {
            if (!data) return data;
            const str = typeof data === 'object' ? JSON.stringify(data) : String(data);
            let res = ''; for(let i=0; i<str.length; i++) res += String.fromCharCode(str.charCodeAt(i) ^ "SAGE2026".charCodeAt(i % 8));
            return CryptoUtils.b64EncodeUnicode(res);
        },
        decrypt: (b64) => {
            if (!b64) return b64;
            try {
                const dec = CryptoUtils.b64DecodeUnicode(b64);
                let res = ''; for(let i=0; i<dec.length; i++) res += String.fromCharCode(dec.charCodeAt(i) ^ "SAGE2026".charCodeAt(i % 8));
                try { return JSON.parse(res); } catch(e) { return res; }
            } catch(e) { return b64; }
        },
        hashPassword: async (str) => {
            if (!window.crypto || !window.crypto.subtle) {
                let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
                return "hash_" + Math.abs(hash).toString(16);
            }
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        }
    };

    const DB_FILE_NAME = 'graha_db_v1.19.json';
    const AppDB = {
      config: null, useLocal: false,
      setConfig(owner, repo, token) { 
          this.config = { owner, repo, token }; 
          try { localStorage.setItem('gh_db_config', JSON.stringify(this.config)); localStorage.setItem('gh_use_local','false'); this.useLocal=false; } catch(e){}
      },
      loadConfig() { 
          try {
              if(localStorage.getItem('gh_use_local') === 'true') { this.useLocal = true; return true; }
              const conf = localStorage.getItem('gh_db_config'); 
              if (conf) { this.config = JSON.parse(conf); return true; }
          } catch(e){}
          return false;
      },
      enableLocal() { this.useLocal = true; try { localStorage.setItem('gh_use_local', 'true'); } catch(e){} },
      async callApi(method, path, body = null) {
        if (!this.config) throw new Error("GitHub DB not configured.");
        const url = `https://api.github.com/repos/${this.config.owner}/${this.config.repo}/contents/${path}?t=${Date.now()}`;
        const headers = { 'Authorization': `token ${this.config.token}`, 'Accept': 'application/vnd.github.v3+json' };
        if (body) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
        if (!res.ok && res.status !== 404) throw new Error(`GitHub Error: ${res.statusText}`);
        return res.status === 404 ? null : await res.json();
      },
      async getDB() {
        if(this.useLocal) {
            try { return { sha: null, content: JSON.parse(localStorage.getItem('graha_local_db')||'{"users":{}}') }; }
            catch(e) { return { sha: null, content: { users: {} } }; }
        }
        const data = await this.callApi('GET', DB_FILE_NAME);
        if (!data) return { sha: null, content: { users: {} } }; // Auto-creates empty schema if 404
        return { sha: data.sha, content: JSON.parse(CryptoUtils.b64DecodeUnicode(data.content.replace(/\n/g, ''))) };
      },
      async saveDB(contentObj, sha) {
        if(this.useLocal) { try { localStorage.setItem('graha_local_db', JSON.stringify(contentObj)); } catch(e){} return; }
        await this.callApi('PUT', DB_FILE_NAME, { 
            message: "Graha Ledger Sync v1.19", 
            content: CryptoUtils.b64EncodeUnicode(JSON.stringify(contentObj, null, 2)), 
            ...(sha ? { sha } : {}) 
        });
      },
      async getUserData(email) {
          const db = await this.getDB(); const user = db.content.users?.[email]; if(!user) return null;
          return { ...user, profiles: CryptoUtils.decrypt(user.profiles)||[], settings: CryptoUtils.decrypt(user.settings)||{}, chatHistory: CryptoUtils.decrypt(user.chatHistory)||[] };
      },
      async syncUserData(email, userData) {
        const db = await this.getDB(); if(!db.content.users) db.content.users = {};
        db.content.users[email] = { ...db.content.users[email], 
            profiles: CryptoUtils.encrypt(userData.profiles || []), settings: CryptoUtils.encrypt(userData.settings || {}), chatHistory: CryptoUtils.encrypt(userData.chatHistory || []) 
        };
        await this.saveDB(db.content, db.sha);
      },
      async getGlobalChatHistory() {
        const db = await this.getDB(); if(!db.content.users) return [];
        let globalHistory = [];
        Object.values(db.content.users).forEach(u => {
            const hist = CryptoUtils.decrypt(u.chatHistory) || [];
            globalHistory = globalHistory.concat(hist);
        });
        return globalHistory;
      }
    };

    // Constants & Astrological Math
    const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
    const NAKSHATRAS = ["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];

    const KARANAS = ["Bava","Balava","Kaulava","Taitila","Gara","Vanija","Vishti (Bhadra)"];
    const WEEKDAY = ["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn"];
    const SANSKRIT_DAYS = { Sun: "Ravi", Moon: "Soma", Mars: "Mangala", Mercury: "Budha", Jupiter: "Brihaspati", Venus: "Shukra", Saturn: "Shani" };

    const PLANET_INFO = {

    const CITY_PRESETS = [ 
        { name: "Phalodi, India", lat: 27.13, lon: 72.36, utc: 5.5 }, { name: "Ujjain, India", lat: 23.17, lon: 75.78, utc: 5.5 },

    function norm360(x) { let v = x % 360; return v < 0 ? v + 360 : v; }
    function toRad(d) { return (d * Math.PI) / 180; }
    function julianDay(dStr, tStr, utc) { const [Y,M,D]=(dStr||"2000-01-01").split("-").map(Number); const [h,m]=(tStr||"12:00").split(":").map(Number); return (Date.UTC(Y,M-1,D,h,m,0) - (utc*3600000)) / 86400000 + 2440587.5; }
    function getAya(Y) { return 23.85 + (Y - 2000) * 0.013972; }
    function sunLon(T) { const M = norm360(357.529 + 35999.05*T); const L = norm360(280.466 + 36000.77*T + 1.915*Math.sin(toRad(M))); return {L, R: 1.00014 - 0.01671*Math.cos(toRad(M))}; }
    function moonLon(T) { const D=norm360(297.85+445267.11*T), M=norm360(357.52+35999.05*T), Mp=norm360(134.96+477198.86*T); return norm360(218.316+481267.88*T + 6.28*Math.sin(toRad(Mp)) + 1.27*Math.sin(toRad(2*D-Mp))); }

    const PE = { Mercury: { a: 0.387, e: 0.205, i: 7.004, L: [252.25, 149472.67], peri: 77.45, node: 48.33 }, Venus: { a: 0.723, e: 0.006, i: 3.394, L: [181.97, 58517.81], peri: 131.60, node: 76.67 }, Mars: { a: 1.523, e: 0.093, i: 1.849, L: [-4.55, 19140.30], peri: -23.94, node: 49.55 }, Jupiter: { a: 5.202, e: 0.048, i: 1.304, L: [34.39, 3034.74], peri: 14.72, node: 100.47 }, Saturn: { a: 9.536, e: 0.053, i: 2.485, L: [49.95, 1222.49], peri: 92.59, node: 113.66 } };
    function helio(n, T) { const p=PE[n], a=p.a, e=p.e, i=toRad(p.i), L=p.L[0]+p.L[1]*T, peri=p.peri, node=p.node; const w=toRad(norm360(peri-node)), Om=toRad(norm360(node)), M=toRad(norm360(L-peri)); const E=M+e*Math.sin(M); const xo=a*(Math.cos(E)-e), yo=a*Math.sqrt(1-e*e)*Math.sin(E); const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(Om),so=Math.sin(Om),ci=Math.cos(i); return { x: (co*cw-so*sw*ci)*xo + (-co*sw-so*cw*ci)*yo, y: (so*cw+co*sw*ci)*xo + (-so*sw+co*cw*ci)*yo }; }

    function computeKundli(profile, dateObj = null) {
        if(!profile) return null;
        const targetDate = dateObj || new Date();
        const JD = julianDay(profile.dob, profile.time, profile.utcOffset); const T = (JD-2451545)/36525;
        const [Y,Mo] = (profile.dob||"2000-01-01").split("-").map(Number); const aya = getAya(Y+(Mo-1)/12);
        
        const s = sunLon(T); const e = {x: s.R*Math.cos(toRad(norm360(s.L+180))), y: s.R*Math.sin(toRad(norm360(s.L+180)))};
        const sid = { Sun: norm360(s.L-aya), Moon: norm360(moonLon(T)-aya), Rahu: norm360(norm360(125.04-1934.13*T)-aya) };
        sid.Ketu = norm360(sid.Rahu+180);
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,T); sid[p] = norm360(Math.atan2(h.y-e.y, h.x-e.x)*180/Math.PI - aya); });
        
        const [hh,mm]=(profile.time||"12:00").split(":").map(Number); const ascL = norm360(sid.Sun + ((hh+mm/60)-6)*15);
        
        const getDiv = (lon, div) => {
            if(div===1) return SIGNS[Math.floor(lon/30)];
            if(div===9) return SIGNS[ ( [0,9,6,3,0,9,6,3,0,9,6,3][Math.floor(lon/30)] + Math.floor((lon%30)/(30/9)) ) % 12 ];
            if(div===10) return SIGNS[ ( (Math.floor(lon/30)%2!==0 ? Math.floor(lon/30)+8 : Math.floor(lon/30)) + Math.floor((lon%30)/3) ) % 12 ];
        };
        const genC = (div) => {
            const lg=getDiv(ascL,div); const idx=SIGNS.indexOf(lg);
            const hs={}, pl={}; for(let i=1;i<=12;i++){ hs[i]=SIGNS[(idx+i-1)%12]; }
            Object.entries(sid).forEach(([p, l]) => pl[p] = ((SIGNS.indexOf(getDiv(l,div))-idx+12)%12)+1);
            return { lagna: lg, houses: hs, placements: pl };
        };
        const moonIdx = Math.floor(sid.Moon/(360/27));

        const trJD = julianDay(targetDate.toISOString().slice(0,10), "12:00", profile.utcOffset); const trT = (trJD-2451545)/36525;
        const ts = sunLon(trT); const te = {x: ts.R*Math.cos(toRad(norm360(ts.L+180))), y: ts.R*Math.sin(toRad(norm360(ts.L+180)))};
        const transits = { Sun: SIGNS[Math.floor(norm360(ts.L-aya)/30)], Moon: SIGNS[Math.floor(norm360(moonLon(trT)-aya)/30)] };
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,trT); transits[p] = SIGNS[Math.floor(norm360(Math.atan2(h.y-te.y, h.x-te.x)*180/Math.PI - aya)/30)]; });

        return { d1: genC(1), d9: genC(9), d10: genC(10), moonSign: SIGNS[Math.floor(sid.Moon/30)], sunSign: SIGNS[Math.floor(sid.Sun/30)], nak: NAKSHATRAS[moonIdx], pada: Math.floor((sid.Moon%(360/27))/((360/27)/4))+1, transits };
    }

    function panchang(dObj, ms="amanta", utc=5.5) {
        const JD = julianDay(dObj.toISOString().slice(0,10), "12:00", utc); const T = (JD-2451545)/36525;
        const sl=sunLon(T).L, ml=moonLon(T); const diff=norm360(ml-sl);
        const tIdx=Math.floor(diff/12); const isS=tIdx<15; 
        const mIdx=Math.floor(norm360(sl)/30); const masa = ms==="purnimanta"&&!isS ? LUNAR_MASAS[(mIdx+1)%12] : LUNAR_MASAS[mIdx];
        
        const d = new Date(dObj); d.setHours(6,0,0,0); const sr = new Date(d); d.setHours(18,0,0,0); const ss = new Date(d);
        d.setHours(18,30,0,0); const mr = new Date(d); d.setHours(6,30,0,0); const msr = new Date(d); d.setDate(d.getDate()+1);
        const dMs = ss-sr; const getS = (s, dur) => ({ s: new Date(s), e: new Date(s+dur) });
        
        const dow = dObj.getDay(); const abh = getS(sr.getTime()+(dMs/15)*7, dMs/15);
        const ct = [{n:"Udveg", d:"Anxiety", c:"#B23A48"}, {n:"Amrit", d:"Nectar", c:"#8FB2D9"}, {n:"Rog", d:"Disease", c:"#B23A48"}, {n:"Labh", d:"Gain", c:"#8FC9A9"}, {n:"Shubh", d:"Auspicious", c:"#D4A574"}, {n:"Char", d:"Moving", c:"#9FB8D9"}, {n:"Kaal", d:"Loss", c:"#8288A0"}];
        const cm = {0:[0,5,3,1,2,4,6,0], 1:[1,2,4,6,0,5,3,1], 2:[2,4,6,0,5,3,1,2], 3:[3,1,2,4,6,0,5,3], 4:[4,6,0,5,3,1,2,4], 5:[5,3,1,2,4,6,0,5], 6:[6,0,5,3,1,2,4,6]};
        const chog = cm[dow].map((i, idx) => ({ ...ct[i], ...getS(sr.getTime()+idx*(dMs/8), dMs/8) }));
        const hoOrder = [0,5,3,1,6,4,2]; const sHoIdx = [0,3,6,2,5,1,4][dow];
        const horas = Array.from({length:12}).map((_,i) => ({ p: WEEKDAY[hoOrder[(hoOrder.indexOf(sHoIdx)+i)%7]], ...getS(sr.getTime()+i*(dMs/12), dMs/12) }));

        return { 
            tithi: ["Pratipada","Dwitiya","Tritiya","Chaturthi","Panchami","Shashthi","Saptami","Ashtami","Navami","Dashami","Ekadashi","Dwadashi","Trayodashi","Chaturdashi",isS?"Purnima":"Amavasya"][tIdx%15],
            paksha: isS?"Shukla":"Krishna", masa, nak: NAKSHATRAS[Math.floor(ml/(360/27))], yoga: YOGAS[Math.floor(norm360(ml+sl)/(360/27))],
            karana: KARANAS[Math.floor(diff/6)%7]||"Kimstughna", sr, ss, mr, msr, abh, chog, horas, 
            rahu: getS(sr.getTime()+dMs*0.8, dMs*0.1), vikram: dObj.getFullYear() + 57, saka: dObj.getFullYear() - 78
        };
    }

    function bio(dob, td, utc) {
        const [Y,M,D]=(dob||"2000-01-01").split("-").map(Number);
        const eD = (Date.UTC(td.getFullYear(),td.getMonth(),td.getDate(),12,0,0)-(utc*3600000) - (Date.UTC(Y,M-1,D,12,0,0)-(utc*3600000))) / 86400000;
        return { p: Math.sin(2*Math.PI*eD/23), e: Math.sin(2*Math.PI*eD/28), i: Math.sin(2*Math.PI*eD/33) };
    }

                    <h3 className="font-serif text-[15px] mb-3">Muhurta Windows</h3>
                    <div className="grid grid-cols-2 gap-2 mb-3">
                        <div className="p-3 rounded-xl border border-emerald-500/20 bg-emerald-950/20"><span className="font-mono text-[9px] uppercase text-emerald-400 block mb-1">Abhijit (Auspicious)</span><span className="font-mono text-sm">{fm(pan.abh.s)} - {fm(pan.abh.e)}</span></div>
                        <div className="p-3 rounded-xl border border-red-500/20 bg-red-950/20"><span className="font-mono text-[9px] uppercase text-red-400 block mb-1">Rahu Kaal (Avoid)</span><span className="font-mono text-sm">{fm(pan.rahu.s)} - {fm(pan.rahu.e)}</span></div>
                    </div>
                    <h3 className="font-serif text-[15px] mb-2 mt-4 text-amber-200">Day Choghadiya</h3>
                    <div className="space-y-1">
                        {pan.chog.map((c,i)=><div key={i} className="flex justify-between items-center p-2 bg-black/20 border border-white/5 rounded text-xs"><div className="flex gap-2 items-center"><span style={{color:c.c}}>{c.n}</span><span className="t50 text-[9px] uppercase font-mono">{c.d}</span></div><div className="font-mono t85">{fm(c.s)} - {fm(c.e)}</div></div>)}
                    </div>
                    <h3 className="font-serif text-[15px] mb-2 mt-4 text-emerald-200">Planetary Hora</h3>
                    <div className="space-y-1">
                        {pan.horas.map((h,i)=><div key={i} className="flex justify-between items-center p-2 bg-black/20 border border-white/5 rounded text-xs"><span style={{color:PLANET_INFO[h.p]?.color}} className="font-medium">{h.p}</span><div className="font-mono t85">{fm(h.s)} - {fm(h.e)}</div></div>)}
                    </div>
                </div>
            </div>
        );
    }

    function CompatTab({ prs, chs, settings, date }) {
        const [pairIds, setPairIds] = useState(prs.length >= 2 ? [prs[0].id, prs[1].id] : [prs[0]?.id, prs[0]?.id]);
        if(prs.length<2) return <div className="p-6 text-center text-sm t60 border border-dashed border-white/20 rounded-3xl mt-6 bgfaint3">Create a 2nd profile to unlock Union compatibility.</div>;
        
        const p1=prs.find(p=>p.id===pairIds[0])||prs[0]; const p2=prs.find(p=>p.id===pairIds[1])||prs[1]; 
        const c1=chs[p1.id], c2=chs[p2.id]; if(!c1||!c2) return null;
        const score = 36 - (Math.abs(NAKSHATRAS.indexOf(c1.nak) - NAKSHATRAS.indexOf(c2.nak))%10)*1.5;
        
        return (
            <div className="space-y-4 pb-10 gl-fadein mt-4">
                <div className="rounded-3xl border border-white/10 p-5 bg-gradient-to-br from-pink-900/20 to-transparent flex flex-col sm:flex-row justify-between gap-4">
                    <div>
                        <div className="font-mono text-[10px] uppercase tracking-[0.25em] t40 mb-1">Union Analysis</div>
                        <div className="flex items-center gap-2">
                            <select value={pairIds[0]} onChange={(e)=>setPairIds([e.target.value, pairIds[1]])} className="bg-black/30 border border-white/10 rounded-lg p-1 font-serif text-lg t100 outline-none">{prs.map(p=><option key={p.id} value={p.id}>{p.name.split(' ')[0]}</option>)}</select>
                            <span className="font-serif text-pink-300">&amp;</span>
                            <select value={pairIds[1]} onChange={(e)=>setPairIds([pairIds[0], e.target.value])} className="bg-black/30 border border-white/10 rounded-lg p-1 font-serif text-lg t100 outline-none">{prs.map(p=><option key={p.id} value={p.id}>{p.name.split(' ')[0]}</option>)}</select>
                        </div>
                    </div>
                    <div className="text-center p-3 rounded-xl bg-black/40 border border-white/10"><div className="text-2xl font-serif text-pink-300">{score.toFixed(1)}</div><div className="text-[9px] t50 uppercase font-mono mt-1">Out of 36</div></div>
                </div>
                <div className="p-5 rounded-2xl border border-white/10 bgfaint3 text-sm leading-relaxed">
                    <h3 className="font-serif text-[15px] mb-2 text-pink-200">Ashtakoot Guna Milan</h3>
                    <p className="t85 mb-3">{score>25?"Excellent match. Providing a highly stable foundation.":score>18?"Moderate match. Requires conscious effort regarding emotional sync.":"Challenging match. High elemental friction."}</p>
                </div>
            </div>
        );
    }

    function AskTab({ em, set, pr, ch }) {
        const [q, setQ]=useState(""); const [h, setH]=useState([]); const [l, setL]=useState(false);
        useEffect(()=>{ (async()=>{ const u = await AppDB.getUserData(em); if(u?.chatHistory) setH(u.chatHistory); })(); },[em]);
        
        async function ask(e){
            e.preventDefault(); if(!q.trim()||l) return; setL(true); 
            let ans = "";
            if(set.aiModel==='offline'){ 
                const globalHist = await AppDB.getGlobalChatHistory();
                const matched = globalHist.find(gh => gh.q.toLowerCase().includes(q.toLowerCase().split(' ')[0]));
                if (matched) {
                    ans = `[Offline Learning Engine] Synthesizing past global query: "${matched.a}" applied to ${pr?.name||'User'}'s ${ch?.moonSign||'Aries'} Moon configuration.`;
                } else {
                    ans = `[Offline Learning Engine] Analyzing basic transit. Based on ${pr?.name||'User'}'s ${ch?.moonSign||'Aries'} Moon: Focus is required over expansion today. Trust intuition.`; 
                }
            } else { 
                if(!set.apiKeys?.[set.aiModel]) ans=`Error: Missing API Key in Settings Vault.`; 
                else {
                    try {
                        const payload = { contents: [{ parts: [{ text: `Act as a Jyotish astrologer for ${pr?.name||'User'} (${ch?.moonSign||'Aries'} Moon). Answer: ${q}` }] }] };
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${set.apiKeys[set.aiModel]}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        ans = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
                    } catch(err) { ans = `API Error: ${err.message}.`; }
                }
            }
            const nx = [...h, {id:Date.now(), q, a:ans, v:set.aiModel}]; setH(nx); setQ(""); setL(false);
            const u = await AppDB.getUserData(em); if(u) await AppDB.syncUserData(em, {...u, chatHistory:nx});
        }

        return (
            <div className="space-y-4 pb-10 gl-fadein mt-4">
                <div className="rounded-3xl border border-white/10 p-5 bg-gradient-to-br from-blue-900/20 to-transparent">
                    <h2 className="font-serif text-2xl text-blue-200">Ask the Sage</h2>
                    <p className="text-[11px] t60 font-mono mt-1">End-to-End Encrypted Cloud History</p>
                </div>
                <div className="space-y-4 max-h-[50vh] overflow-y-auto pr-2">
                    {h.map(x=><div key={x.id} className="space-y-1"><div className="flex gap-2"><div className="text-amber-400 font-bold">Q:</div><div className="text-sm t85">{x.q}</div></div><div className="p-4 bg-black/20 border border-white/5 rounded-2xl text-sm t85 leading-relaxed whitespace-pre-wrap">{x.a}<div className="text-[9px] t40 font-mono mt-3 uppercase border-t border-white/10 pt-2">via {x.v}</div></div></div>)}
                    {l&&<div className="text-xs t50 italic p-3">Synthesizing Jyotish context...</div>}
                </div>
                <form onSubmit={ask} className="flex gap-2 p-2 bgfaint3 border border-white/10 rounded-2xl sticky bottom-4 shadow-2xl">
                    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ask about timing, career, doshas..." className="flex-1 bg-transparent text-sm focus:outline-none px-2"/>
                    <button type="submit" disabled={l} className="px-5 py-2.5 bg-amber-400 text-black text-sm font-semibold rounded-xl disabled:opacity-50 hover:bg-amber-300 transition">Ask</button>
                </form>
            </div>
        );
    }

    function AppContent() {
        const [dbC, setDbC]=useState(false); const [u, setU]=useState(null); const [tb, setTb]=useState("person");
        const [dt, setDt]=useState(new Date()); const [ss, setSs]=useState(false); const [ed, setEd]=useState(null);
        const [ex, setEx]=useState(false);

        useEffect(()=>{ if(AppDB.loadConfig()) setDbC(true); },[]);

        if(!dbC) return <div className="min-h-screen flex items-center justify-center p-4"><SetupModal onConfig={()=>setDbC(true)}/></div>;
        if(!u) return <div className="min-h-screen flex items-center justify-center p-4"><AuthModal onLogin={(e,d)=>setU({e,d})}/></div>;
        if(u?.d?.requiresPasswordChange) return <div className="min-h-screen flex items-center justify-center p-4"><ForcePasswordChange email={u.e} onComplete={() => setU({...u, d: {...u.d, requiresPasswordChange: false}})} /></div>;

        const prs = u?.d?.profiles||[]; 
        const set = u?.d?.settings||{aiModel:"offline", monthSystem:"amanta", kundaliStyle:"north", apiKeys:{}};
        const chs = useMemo(()=>{ const o={}; prs.forEach(p=>o[p.id]=computeKundli(p, dt)); return o; },[prs,dt]);
        const aP = prs.length > 0 ? prs[0] : null;

        const hSave = async(e) => {
            e.preventDefault(); const f=e.target;
            const pD = { 
                name: f.nm.value, dob: f.dob.value, time: f.tm.value, place: f.pl.value, 
                lat: parseFloat(f.lt.value), lon: parseFloat(f.ln.value), utcOffset: parseFloat(f.ut.value), 
                gotra: f.gt.value, jaati: f.jt.value, kulDevta: f.kd.value, gramDevta: f.gd.value, sthanDevta: f.sd.value,
                id: ed.id||Date.now().toString(), accent: ed.accent||"#D4A574" 
            };
            const nP = ed.id ? prs.map(p=>p.id===pD.id?pD:p) : [...prs, pD];
            await AppDB.syncUserData(u.e, {...u.d, profiles:nP}); setU({...u, d:{...u.d, profiles:nP}}); setEd(null);
        };

        return (
            <div className="min-h-screen w-full font-sans pb-10">
                <div className="bgcard2 border-b border-white/10 sticky top-0 z-30 shadow-lg">
                    <div className="mx-auto max-w-md sm:max-w-3xl px-4 py-3 flex justify-between items-center pr-12">
                        <div className="flex items-center gap-3">
                            <SageLogo size={28}/>
                            <div>
                                <h1 className="font-serif text-xl text-amber-300 leading-tight">Graha Ledger</h1>
                                <div className="text-[9px] font-mono t50 uppercase tracking-widest">{u.e}</div>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={()=>setEd({})} className="p-2 rounded-full border border-white/10 bg-black/20 hover:bg-white/10 transition"><Icon name="user-plus" size={18}/></button>
                            <button onClick={()=>setSs(true)} className="p-2 rounded-full border border-white/10 bg-black/20 hover:bg-white/10 transition relative"><Icon name="gear" size={18}/></button>
                        </div>
                    </div>
                </div>

                <div className="mx-auto max-w-md sm:max-w-3xl px-4 py-6 relative z-10">
                    {prs.length===0 ? (
                        <div className="text-center p-8 border border-dashed border-white/20 rounded-3xl mt-10 bgfaint3 gl-fadein">
                            <h2 className="font-serif text-2xl mb-2 text-amber-300">Welcome to Graha Ledger</h2>
                            <p className="text-sm t60 mb-6 leading-relaxed">Your secure, serverless Jyotish companion. Create your first profile to unlock exact transits, panchang, and AI insights.</p>
                            <button onClick={()=>setEd({})} className="px-8 py-3 rounded-full bg-amber-400 text-black text-sm font-semibold hover:bg-amber-300 transition shadow-lg shadow-amber-400/20">Create Natal Profile</button>
                        </div>
                    ) : (
                        <>
                            <div className="flex gap-1 overflow-x-auto rounded-xl border border-white/10 bgfaint2 p-1 font-mono text-xs shadow-inner">
                                {[{id:"person",l:"Astrology"},{id:"panchang",l:"Panchang"},{id:"union",l:"Union"},{id:"ask",l:"Ask AI"}].map(t=><button key={t.id} onClick={()=>setTb(t.id)} className={`flex-1 whitespace-nowrap rounded-lg px-3 py-2.5 transition ${tb===t.id?"bg-white/15 t100 shadow":"t50 hover:t100"}`}>{t.l}</button>)}
                            </div>
                            {tb==="person" && <PersonTab pr={aP} ch={chs[aP?.id]} date={dt} setDate={setDt} ex={ex} setEx={setEx} settings={set}/>}
                            {tb==="panchang" && <PanchangTab d={dt} p={aP} utc={aP?.utcOffset||5.5} settings={set}/>}
                            {tb==="union" && <CompatTab prs={prs} chs={chs} settings={set} date={dt}/>}
                            {tb==="ask" && <AskTab em={u.e} set={set} pr={aP} ch={chs[aP?.id]}/>}
                        </>
                    )}

                    {ss && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4" onClick={()=>setSs(false)}>
                            <div onClick={e=>e.stopPropagation()} className="w-full max-w-sm p-6 rounded-3xl border border-white/10 bgcard2 space-y-5 max-h-[85vh] overflow-y-auto gl-fadein shadow-2xl relative">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3"><h3 className="font-serif text-lg t100">Settings Vault</h3><button onClick={()=>setSs(false)} className="p-1 rounded-full hover:bg-white/10 transition"><Icon name="x"/></button></div>
                                <div>
                                    <label className="text-[9px] font-mono uppercase t50 mb-1.5 block">Update Password</label>
                                    <div className="flex gap-2">
                                        <input id="new_pw_input" type="password" placeholder="Enter new password" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/>
                                        <button type="button" onClick={async () => {
                                            const v = document.getElementById('new_pw_input').value; if(!v || v.length < 6) return alert('Password too short.');
                                            const db = await AppDB.getDB(); db.content.users[u.e].password = await CryptoUtils.hashPassword(v); await AppDB.saveDB(db.content, db.sha);
                                            alert('Password updated!'); document.getElementById('new_pw_input').value = '';
                                        }} className="px-4 py-2 bg-amber-400 text-black font-semibold rounded-xl text-xs hover:bg-amber-300 transition">Save</button>
                                    </div>
                                </div>
                                <div><label className="text-[9px] font-mono uppercase t50 mb-1.5 block">AI Intelligence Engine</label><select value={set.aiModel} onChange={e=> { const ns={...set,aiModel:e.target.value}; AppDB.syncUserData(u.e, {...u.d, settings:ns}); setU({...u, d:{...u.d, settings:ns}}); }} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"><option value="offline">Offline Learning Engine</option><option value="gemini-1.5-flash">Gemini 1.5 Flash</option></select></div>
                                <div className="p-4 border border-emerald-500/20 bg-emerald-950/10 rounded-2xl space-y-3">
                                    <label className="text-[10px] text-emerald-400 font-mono uppercase flex items-center justify-between">Encrypted API Keys <a href="https://aistudio.google.com/app/apikey" target="_blank" className="hover:text-emerald-200" title="Get API Key"><Icon name="question"/></a></label>
                                    <div><div className="text-[9px] t50 mb-1">Gemini Key</div><input type="password" value={set.apiKeys?.["gemini-1.5-flash"]||""} onChange={e=>{ const ns={...set,apiKeys:{...set.apiKeys,["gemini-1.5-flash"]:e.target.value}}; AppDB.syncUserData(u.e, {...u.d, settings:ns}); setU({...u, d:{...u.d, settings:ns}}); }} placeholder="Paste token here..." className="w-full bg-black/50 border border-white/5 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500/50"/></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {ed && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/80 p-4" onClick={()=>setEd(null)}>
                            <form onClick={e=>e.stopPropagation()} onSubmit={hSave} className="w-full max-w-sm bgcard2 rounded-3xl border border-white/10 p-6 space-y-4 max-h-[90vh] overflow-y-auto gl-fadein shadow-2xl relative">
                                <div className="flex justify-between border-b border-white/10 pb-3"><h3 className="font-serif text-lg t100">{ed.id?"Edit Profile":"New Profile"}</h3><button type="button" onClick={()=>setEd(null)} className="p-1 rounded-full hover:bg-white/10 transition"><Icon name="x"/></button></div>
                                <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Full Name</label><input required name="nm" defaultValue={ed.name||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"/></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Date</label><input required type="date" name="dob" defaultValue={ed.dob||"2000-01-01"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Time</label><input required type="time" name="tm" defaultValue={ed.time||"12:00"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"/></div>
                                </div>
                                <div>
                                    <label className="text-[9px] t50 uppercase font-mono mb-1 block">Quick Location Autofill</label>
                                    <select onChange={e=>{const p=CITY_PRESETS.find(c=>c.name===e.target.value); if(p){e.target.form.pl.value=p.name; e.target.form.lt.value=p.lat; e.target.form.ln.value=p.lon; e.target.form.ut.value=p.utc;}}} className="w-full bg-amber-400/10 border border-amber-400/30 text-amber-200 rounded-xl px-3 py-2.5 text-sm outline-none"><option value="">- Select City -</option>{CITY_PRESETS.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}</select>
                                </div>
                                <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Place Name</label><input required name="pl" defaultValue={ed.place||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none"/></div>
                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Lat</label><input required type="number" step="any" name="lt" defaultValue={ed.lat||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Lon</label><input required type="number" step="any" name="ln" defaultValue={ed.lon||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">UTC</label><input required type="number" step="any" name="ut" defaultValue={ed.utcOffset||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none"/></div>
                                </div>
                                <div className="pt-3 border-t border-white/10">
                                    <div className="text-[10px] t40 uppercase font-mono mb-3 tracking-widest text-center">Spiritual Lineage</div>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Gotra</label><input name="gt" defaultValue={ed.gotra||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none"/></div>
                                        <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Jaati / Varg</label><input name="jt" defaultValue={ed.jaati||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none"/></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Kul Devta</label><input name="kd" defaultValue={ed.kulDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none"/></div>
                                        <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Gram Devta</label><input name="gd" defaultValue={ed.gramDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none"/></div>
                                    </div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Sthan Devta</label><input name="sd" defaultValue={ed.sthanDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none"/></div>
                                </div>
                                <button type="submit" className="w-full bg-amber-400 text-black font-semibold rounded-full py-3 mt-4 hover:bg-amber-300 transition shadow-lg shadow-amber-400/20">Save Profile</button>
                            </form>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    
    const root = window.ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<ErrorBoundary><AppContent/></ErrorBoundary>);
  </script>
</body>
</html>
