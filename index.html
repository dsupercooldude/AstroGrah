<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graha Ledger — Enterprise Vedic Jyotish & Biorhythm Vault</title>
    
    <!-- Anti-Cache Headers to stop browser disk caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ADD THIS LINE FOR THE ICONS -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Fraunces & Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>

    <!-- External Libraries (jsPDF, html2canvas, OTPAuth, React, Babel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Sora', sans-serif;
        background-color: #0b0d19;
        color: #F2EFE6;
      }
      .font-serif { font-family: 'Fraunces', serif; }
      .bgcard { background-color: #121426; }
      .bgcard2 { background-color: #181b33; }
      .bgfaint { background-color: rgba(255, 255, 255, 0.02); }
      .t100 { color: #F2EFE6; }
      .t85 { color: rgba(242, 239, 230, 0.85); }
      .t75 { color: rgba(242, 239, 230, 0.75); }
      .t60 { color: rgba(242, 239, 230, 0.6); }
      .t50 { color: rgba(242, 239, 230, 0.5); }
      .t40 { color: rgba(242, 239, 230, 0.4); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .gl-fadein { animation: fadeIn 0.3s ease-out forwards; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0b0d19] min-h-screen text-[#F2EFE6] selection:bg-amber-400 selection:text-black">

    <!-- Initial Bootloader (Replaced by React App on Successful Load) -->
    <div id="bootloader" class="min-h-screen flex items-center justify-center p-4">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <div class="font-mono text-xs text-amber-300 tracking-widest uppercase">Initializing Graha Ledger Engine...</div>
      </div>
    </div>

    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Core JavaScript Support Files -->
    <script src="src/js/database.js"></script>
    <script src="src/js/cryptography.js"></script>
    <script src="src/js/formulas.js"></script>
    <script src="src/js/ai-rules.js"></script>

    <!-- Synchronous Cache-Busting Script Loader for Babel -->
    <script type="text/javascript">
      (function() {
        var cb = Date.now();
       var modules = [
          "src/jsx/components.jsx",
          "src/jsx/modals.jsx",
          "src/jsx/charts.jsx",
          "src/jsx/pdf-report.jsx",
          "src/jsx/tab-person.jsx",
          "src/jsx/tab-panchang.jsx",
          "src/jsx/tab-union.jsx",
          "src/jsx/tab-ask.jsx",
          "src/jsx/tab-reports.jsx",
          "src/jsx/tab-week.jsx",    // <--- ADD THIS
          "src/jsx/tab-month.jsx",   // <--- ADD THIS
          "src/jsx/tabs.jsx",
          "src/jsx/app.jsx"
        ];
        
        for (var i = 0; i < modules.length; i++) {
          document.write('<script type="text/babel" src="' + modules[i] + '?t=' + cb + '"><\/script>');
        }
      })();
    </script>
</body>
</html>
