    const SECRET_SALT = "GRAHA_SAGE_KEY_2026";
    const CryptoUtils = {
        b64EncodeUnicode: (str) => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1))),
        b64DecodeUnicode: (str) => decodeURIComponent(atob(str).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')),
        encrypt: (data) => {
            if (!data) return data;
            const str = typeof data === 'object' ? JSON.stringify(data) : String(data);
            let res = ''; for(let i=0; i<str.length; i++) res += String.fromCharCode(str.charCodeAt(i) ^ SECRET_SALT.charCodeAt(i % SECRET_SALT.length));
            return CryptoUtils.b64EncodeUnicode(res);
        },
        decrypt: (b64) => {
            if (!b64) return b64;
            try {
                const dec = CryptoUtils.b64DecodeUnicode(b64);
                let res = ''; for(let i=0; i<dec.length; i++) res += String.fromCharCode(dec.charCodeAt(i) ^ SECRET_SALT.charCodeAt(i % SECRET_SALT.length));
                try { return JSON.parse(res); } catch(e) { return res; }
            } catch(e) { return b64; }
        },
        hashPassword: async (password) => {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
    };

    const AppDB = {

      async callApi(method, path, body = null) {
        if (!this.config) throw new Error("GitHub DB not configured.");
        const url = `https://api.github.com/repos/${this.config.owner}/${this.config.repo}/contents/${path}?t=${Date.now()}`;
        const headers = { 'Authorization': `token ${this.config.token}`, 'Accept': 'application/vnd.github.v3+json' };
        if (body) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
        if (!res.ok && res.status !== 404) throw new Error(`GitHub Error: ${res.statusText}`);
        return res.status === 404 ? null : await res.json();
      },
      async getDB() {
        if(this.useLocal) return { sha: null, content: JSON.parse(localStorage.getItem('graha_local_db')||'{"users":{}}') };
        const data = await this.callApi('GET', 'graha_db_v3.json');
        if (!data) return { sha: null, content: { users: {} } };
        const cleanB64 = data.content.replace(/\n/g, '');
        return { sha: data.sha, content: JSON.parse(CryptoUtils.b64DecodeUnicode(cleanB64)) };
      },
      async saveDB(contentObj, sha) {
        if(this.useLocal) { localStorage.setItem('graha_local_db', JSON.stringify(contentObj)); return; }
        const jsonStr = JSON.stringify(contentObj, null, 2);
        const encoded = CryptoUtils.b64EncodeUnicode(jsonStr);
        await this.callApi('PUT', 'graha_db_v3.json', { message: "Graha Ledger Sync", content: encoded, ...(sha ? { sha } : {}) });
      },
      async syncUserData(email, userData) {
        const db = await this.getDB();
        if(!db.content.users) db.content.users = {};
        db.content.users[email] = { ...db.content.users[email], 
            profiles: CryptoUtils.encrypt(userData.profiles || []), 
            settings: CryptoUtils.encrypt(userData.settings || {}), 
            chatHistory: CryptoUtils.encrypt(userData.chatHistory || []) 
        };
        await this.saveDB(db.content, db.sha);
      },
      async getUserData(email) {
          const db = await this.getDB();
          const user = db.content.users?.[email];
          if(!user) return null;
          return { ...user, profiles: CryptoUtils.decrypt(user.profiles)||[], settings: CryptoUtils.decrypt(user.settings)||{}, chatHistory: CryptoUtils.decrypt(user.chatHistory)||[], requiresPasswordChange: user.requiresPasswordChange };
      },
      async getGlobalChatHistory() {
          const db = await this.getDB();
          let allChats = [];
          if(db.content.users) {
              Object.values(db.content.users).forEach(u => {
                  const hist = CryptoUtils.decrypt(u.chatHistory);
                  if(Array.isArray(hist)) allChats = [...allChats, ...hist];
              });
          }
          return allChats;
      }

    function norm360(x) { let v = x % 360; return v < 0 ? v + 360 : v; }
    function toRad(d) { return (d * Math.PI) / 180; }
    function julianDay(dStr, tStr, utc) { const [Y,M,D]=(dStr||"2000-01-01").split("-").map(Number); const [h,m]=(tStr||"12:00").split(":").map(Number); return (Date.UTC(Y,M-1,D,h,m,0) - (utc*3600000)) / 86400000 + 2440587.5; }
    function getAya(Y, type) { return (type === "kp" ? 23.90 : 23.85) + (Y - 2000) * 0.013972; }

    const PE = {
        Mercury: { a: [0.387, 0], e: [0.205, 0], i: [7.004, 0], L: [252.25, 149472.67], peri: [77.45, 0.16], node: [48.33, -0.12] },
        Venus:   { a: [0.723, 0], e: [0.006, 0], i: [3.394, 0], L: [181.97, 58517.81], peri: [131.60, 0.00], node: [76.67, -0.27] },
        Mars:    { a: [1.523, 0], e: [0.093, 0], i: [1.849, 0], L: [-4.55, 19140.30], peri: [-23.94, 0.44], node: [49.55, -0.29] },
        Jupiter: { a: [5.202, 0], e: [0.048, 0], i: [1.304, 0], L: [34.39, 3034.74], peri: [14.72, 0.21], node: [100.47, 0.20] },
        Saturn:  { a: [9.536, 0], e: [0.053, 0], i: [2.485, 0], L: [49.95, 1222.49], peri: [92.59, -0.41], node: [113.66, -0.28] },
    };
    function helio(n, T) {
        const p=PE[n], a=p.a[0], e=p.e[0], i=toRad(p.i[0]), L=p.L[0]+p.L[1]*T, peri=p.peri[0], node=p.node[0];
        const w=toRad(norm360(peri-node)), Om=toRad(norm360(node)), M=toRad(norm360(L-peri));
        const E=M+e*Math.sin(M); const xo=a*(Math.cos(E)-e), yo=a*Math.sqrt(1-e*e)*Math.sin(E);
        const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(Om),so=Math.sin(Om),ci=Math.cos(i);
        return { x: (co*cw-so*sw*ci)*xo + (-co*sw-so*cw*ci)*yo, y: (so*cw+co*sw*ci)*xo + (-so*sw+co*cw*ci)*yo };
    }
    function sunLon(T) { const M = norm360(357.529 + 35999.05*T); const L = norm360(280.466 + 36000.77*T + 1.915*Math.sin(toRad(M))); return {L, R: 1.00014 - 0.01671*Math.cos(toRad(M))}; }
    function moonLon(T) { const D=norm360(297.85+445267.11*T), M=norm360(357.52+35999.05*T), Mp=norm360(134.96+477198.86*T); return norm360(218.316+481267.88*T + 6.28*Math.sin(toRad(Mp)) + 1.27*Math.sin(toRad(2*D-Mp))); }

    function computeKundli(profile, ayType="lahiri", trDate=null) {
        if(!profile) return null;
        const JD = julianDay(profile.dob, profile.time, profile.utcOffset); const T = (JD-2451545)/36525;
        const [Y,Mo] = (profile.dob||"2000-01-01").split("-").map(Number); const aya = getAya(Y+(Mo-1)/12, ayType);
        
        const s = sunLon(T); const e = {x: s.R*Math.cos(toRad(norm360(s.L+180))), y: s.R*Math.sin(toRad(norm360(s.L+180)))};
        const tr = { Sun: s.L, Moon: moonLon(T), Rahu: norm360(125.04-1934.13*T) };
        tr.Ketu = norm360(tr.Rahu+180);
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,T); tr[p] = norm360(Math.atan2(h.y-e.y, h.x-e.x)*180/Math.PI); });
        
        const sid = {}; Object.keys(tr).forEach(k => sid[k] = norm360(tr[k]-aya));
        const [hh,mm]=(profile.time||"12:00").split(":").map(Number); const ascL = norm360(tr.Sun + ((hh+mm/60)-6)*15 - aya);
        
        const getDiv = (lon, div) => {
            if(div===1) return SIGNS[Math.floor(lon/30)];
            if(div===9) return SIGNS[ ( [0,9,6,3,0,9,6,3,0,9,6,3][Math.floor(lon/30)] + Math.floor((lon%30)/(30/9)) ) % 12 ];
            if(div===10) return SIGNS[ ( (Math.floor(lon/30)%2!==0 ? Math.floor(lon/30)+8 : Math.floor(lon/30)) + Math.floor((lon%30)/3) ) % 12 ];
        };

        const genC = (div) => {
            const lg=getDiv(ascL,div); const idx=SIGNS.indexOf(lg);
            const hs={}, pl={}, ld={}; for(let i=1;i<=12;i++){ hs[i]=SIGNS[(idx+i-1)%12]; }
            Object.entries(sid).forEach(([p, l]) => pl[p] = ((SIGNS.indexOf(getDiv(l,div))-idx+12)%12)+1);
            return { lagna: lg, houses: hs, placements: pl };
        };

        const d1=genC(1), d9=genC(9), d10=genC(10);
        const moonIdx = Math.floor(sid.Moon/(360/27));
        
        const stLord = NAK_LORDS[moonIdx%9]; const frac = (sid.Moon%(360/27))/(360/27);
        let cy = Y+(Mo-1)/12; let cIdx = moonIdx%9; const dashas=[];
        dashas.push({ p: stLord, s: cy, e: cy+(VIM_YEARS[stLord]*(1-frac)) }); cy += VIM_YEARS[stLord]*(1-frac); cIdx=(cIdx+1)%9;
        for(let i=0;i<8;i++) { const p=NAK_LORDS[cIdx]; dashas.push({ p, s: cy, e: cy+VIM_YEARS[p] }); cy+=VIM_YEARS[p]; cIdx=(cIdx+1)%9; }

        let transits = null;
        if (trDate) {
            const trJD = julianDay(trDate.toISOString().slice(0,10), "12:00", profile.utcOffset); const trT = (trJD-2451545)/36525;
            const ts = sunLon(trT); const te = {x: ts.R*Math.cos(toRad(norm360(ts.L+180))), y: ts.R*Math.sin(toRad(norm360(ts.L+180)))};
            transits = {
                Sun: SIGNS[Math.floor(norm360(ts.L-aya)/30)], Moon: SIGNS[Math.floor(norm360(moonLon(trT)-aya)/30)],
                Jupiter: SIGNS[Math.floor(norm360(Math.atan2(helio('Jupiter',trT).y-te.y, helio('Jupiter',trT).x-te.x)*180/Math.PI-aya)/30)],
                Saturn: SIGNS[Math.floor(norm360(Math.atan2(helio('Saturn',trT).y-te.y, helio('Saturn',trT).x-te.x)*180/Math.PI-aya)/30)],
                Mars: SIGNS[Math.floor(norm360(Math.atan2(helio('Mars',trT).y-te.y, helio('Mars',trT).x-te.x)*180/Math.PI-aya)/30)],
                Venus: SIGNS[Math.floor(norm360(Math.atan2(helio('Venus',trT).y-te.y, helio('Venus',trT).x-te.x)*180/Math.PI-aya)/30)],
                Mercury: SIGNS[Math.floor(norm360(Math.atan2(helio('Mercury',trT).y-te.y, helio('Mercury',trT).x-te.x)*180/Math.PI-aya)/30)]
            };
        }

        return { d1, d9, d10, longitudes: sid, moonSign: SIGNS[Math.floor(sid.Moon/30)], sunSign: SIGNS[Math.floor(sid.Sun/30)], nak: NAKSHATRAS[moonIdx], pada: Math.floor((sid.Moon%(360/27))/((360/27)/4))+1, dashas, transits };

    function panchang(dObj, ms="amanta", utc=5.5) {
        const iso = dObj.toISOString().slice(0,10); const JD = julianDay(iso, "12:00", utc); const T = (JD-2451545)/36525;
        const sl=sunLon(T).L, ml=moonLon(T); const diff=norm360(ml-sl);
        const tIdx=Math.floor(diff/12); const isS=tIdx<15; const p=isS?"Shukla":"Krishna";
        const sIdx=Math.floor(norm360(sl)/30); const mIdx=ms==="purnimanta"&&!isS?(sIdx+1)%12:sIdx;
        const yIdx=Math.floor(norm360(ml+sl)/(360/27)); const kIdx=Math.floor(diff/6);
        
        // Approximate Rise/Set for demonstration
        const d = new Date(dObj); d.setHours(6,0,0,0); const sr = new Date(d); d.setHours(18,0,0,0); const ss = new Date(d); 
        d.setHours(18,30,0,0); const mr = new Date(d); d.setHours(6,30,0,0); const msr = new Date(d); d.setDate(d.getDate()+1);
        
        const dMs = ss-sr; const getS = (s, dur) => ({ s: new Date(s), e: new Date(s+dur) });
        const dow = dObj.getDay(); const abh = getS(sr.getTime()+(dMs/15)*7, dMs/15);
        
        const ct = [{n:"Udveg (Anxiety)", c:"#B23A48"}, {n:"Amrit (Nectar)", c:"#8FB2D9"}, {n:"Rog (Disease)", c:"#B23A48"}, {n:"Labh (Gain)", c:"#8FC9A9"}, {n:"Shubh (Auspicious)", c:"#D4A574"}, {n:"Char (Moving)", c:"#9FB8D9"}, {n:"Kaal (Loss)", c:"#8288A0"}];
        const cm = {0:[0,5,3,1,2,4,6,0], 1:[1,2,4,6,0,5,3,1], 2:[2,4,6,0,5,3,1,2], 3:[3,1,2,4,6,0,5,3], 4:[4,6,0,5,3,1,2,4], 5:[5,3,1,2,4,6,0,5], 6:[6,0,5,3,1,2,4,6]};
        const chog = cm[dow].map((i, idx) => ({ ...ct[i], ...getS(sr.getTime()+idx*(dMs/8), dMs/8) }));
        
        const hoOrder = [0,5,3,1,6,4,2]; const sHoIdx = [0,3,6,2,5,1,4][dow];
        const horas = Array.from({length:12}).map((_,i) => ({ p: WEEKDAY[hoOrder[(hoOrder.indexOf(sHoIdx)+i)%7]], ...getS(sr.getTime()+i*(dMs/12), dMs/12) }));

        return { 
            tithi: ["Pratipada","Dwitiya","Tritiya","Chaturthi","Panchami","Shashthi","Saptami","Ashtami","Navami","Dashami","Ekadashi","Dwadashi","Trayodashi","Chaturdashi",isS?"Purnima":"Amavasya"][tIdx%15],
            paksha: p, masa: LUNAR_MASAS[mIdx], nak: NAKSHATRAS[Math.floor(ml/(360/27))], yoga: YOGAS[yIdx],
            karana: kIdx===0?"Kimstughna":kIdx<57?KARANAS[(kIdx-1)%7]:["Shakuni","Chatushpada","Naga"][kIdx-57],
            sr, ss, mr, msr, abh, chog, horas, 
            rahu: getS(sr.getTime()+dMs*0.8, dMs*0.1), yama: getS(sr.getTime()+dMs*0.3, dMs*0.1), guli: getS(sr.getTime()+dMs*0.6, dMs*0.1),
            vikram: dObj.getFullYear() + 57, saka: dObj.getFullYear() - 78
        };
    }

    function bio(dob, td, utc) {
        const [Y,M,D]=(dob||"2000-01-01").split("-").map(Number);
        const eD = (Date.UTC(td.getFullYear(),td.getMonth(),td.getDate(),12,0,0)-(utc*3600000) - (Date.UTC(Y,M-1,D,12,0,0)-(utc*3600000))) / 86400000;
        return { p: Math.sin(2*Math.PI*eD/23), e: Math.sin(2*Math.PI*eD/28), i: Math.sin(2*Math.PI*eD/33) };
    }

                        <>
                            <div className="flex gap-1 overflow-x-auto rounded-xl border border-white/10 bgfaint2 p-1 font-mono text-xs shadow-inner">
                                {[{id:"person",l:"Astrology"},{id:"panchang",l:"Panchang"},{id:"union",l:"Union"},{id:"ask",l:"Ask AI"}].map(t=><button key={t.id} onClick={()=>setTb(t.id)} className={`flex-1 whitespace-nowrap rounded-lg px-3 py-2.5 transition ${tb===t.id?"bg-white/15 t100 shadow":"t50 hover:t100"}`}>{t.l}</button>)}
                            </div>
                            
                            {tb==="person" && <PersonTab pr={aP} ch={chs[aP.id]} date={dt} setDate={setDt} ex={ex} setEx={setEx} settings={set}/>}
                            {tb==="panchang" && <PanchangTab d={dt} p={aP} utc={aP.utcOffset} settings={set}/>}
                            {tb==="union" && <CompatTab prs={prs} chs={chs} settings={set} date={dt}/>}
                            {tb==="ask" && <AskTab em={u.e} set={set} pr={aP} ch={chs[aP.id]}/>}
                        </>
                    )}

                    {ss && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm" onClick={()=>setSs(false)}>
                            <div onClick={e=>e.stopPropagation()} className="w-full max-w-sm p-6 rounded-3xl border border-white/10 bgcard2 space-y-5 max-h-[85vh] overflow-y-auto gl-fadein shadow-2xl custom-scrollbar">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="font-serif text-lg t100">Settings Vault</h3>
                                    <button onClick={()=>setSs(false)} className="p-1 rounded-full hover:bg-white/10 transition"><Icon name="x"/></button>
                                </div>
                                
                                <div>
                                    <label className="fs9 font-mono uppercase t50 mb-1.5 block">Update Password</label>
                                    <div className="flex gap-2">
                                        <input id="new_pw_input" type="password" placeholder="Enter new password" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/>
                                        <button type="button" onClick={async () => {
                                            const v = document.getElementById('new_pw_input').value;
                                            if(!v || v.length < 6) return alert('Password must be at least 6 characters.');
                                            const db = await AppDB.getDB();
                                            db.content.users[u.e].password = await CryptoUtils.hashPassword(v);
                                            await AppDB.saveDB(db.content, db.sha);
                                            alert('Password updated successfully!');
                                            document.getElementById('new_pw_input').value = '';
                                        }} className="px-4 py-2 bg-amber-400 text-black font-semibold rounded-xl text-xs hover:bg-amber-300 transition">Save</button>
                                    </div>
                                    <p className="text-[9px] t40 mt-1">Hashes locally via SHA-256 before saving to cloud.</p>
                                </div>

                                <div><label className="fs9 font-mono uppercase t50 mb-1.5 block">AI Intelligence Engine</label><select value={set.aiModel} onChange={e=>updateSettings({...set,aiModel:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50">{LLM_PROVIDERS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                                <div><label className="fs9 font-mono uppercase t50 mb-1.5 block">Lunar Month System</label><select value={set.monthSystem} onChange={e=>updateSettings({...set,monthSystem:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"><option value="amanta">Amanta (Ends on Amavasya)</option><option value="purnimanta">Purnimanta (Ends on Purnima)</option></select></div>
                                
                                <div className="p-4 border border-emerald-500/20 bg-emerald-950/10 rounded-2xl space-y-3">
                                    <label className="fs10 text-emerald-400 font-mono uppercase flex items-center justify-between">Encrypted API Keys <a href="https://aistudio.google.com/app/apikey" target="_blank" className="hover:text-emerald-200 transition" title="Get API Key"><Icon name="question"/></a></label>
                                    {LLM_PROVIDERS.filter(p=>p.id!=='offline').map(p=><div key={p.id}><div className="flex justify-between fs9 t50 mb-1"><span>{p.name} Key</span></div><input type="password" value={set.apiKeys?.[p.id]||""} onChange={e=>updateSettings({...set,apiKeys:{...set.apiKeys,[p.id]:e.target.value}})} placeholder="Paste token here..." className="w-full bg-black/50 border border-white/5 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500/50"/></div>)}
                                </div>
                                
                                <div className="pt-2 border-t border-white/10">
                                    <label className="fs9 font-mono uppercase t50 mb-2 block">Application Translation</label>
                                    <div className="block sm:hidden" id="google_translate_element_mobile"></div>
                                    <p className="text-[9px] t40 mt-1">Select language to translate the entire UI.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {ed && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm" onClick={()=>setEd(null)}>
                            <form onClick={e=>e.stopPropagation()} onSubmit={hSave} className="w-full max-w-sm bgcard2 rounded-3xl border border-white/10 p-6 space-y-4 max-h-[90vh] overflow-y-auto gl-fadein shadow-2xl custom-scrollbar">
                                <div className="flex justify-between border-b border-white/10 pb-3">
                                    <h3 className="font-serif text-lg t100">{ed.id?"Edit Natal Profile":"New Natal Profile"}</h3>
                                    <button type="button" onClick={()=>setEd(null)} className="p-1 rounded-full hover:bg-white/10 transition"><Icon name="x"/></button>
                                </div>
                                
                                <div><label className="fs9 t50 uppercase font-mono mb-1 block">Full Name</label><input required name="nm" defaultValue={ed.name||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/></div>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">Date</label><input required type="date" name="dob" defaultValue={ed.dob||"2000-01-01"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/></div>
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">Time</label><input required type="time" name="tm" defaultValue={ed.time||"12:00"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/></div>
                                </div>
                                
                                <div>
                                    <label className="fs9 t50 uppercase font-mono mb-1 block">Quick Location Autofill</label>
                                    <select onChange={e=>{const p=CITY_PRESETS.find(c=>c.name===e.target.value); if(p){e.target.form.pl.value=p.name; e.target.form.lt.value=p.lat; e.target.form.ln.value=p.lon; e.target.form.ut.value=p.utc;}}} className="w-full bg-amber-400/10 border border-amber-400/30 text-amber-200 rounded-xl px-3 py-2.5 text-sm outline-none">
                                        <option value="">- Select City -</option>{CITY_PRESETS.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}
                                    </select>
                                </div>
                                
                                <div><label className="fs9 t50 uppercase font-mono mb-1 block">Place Name</label><input required name="pl" defaultValue={ed.place||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-400/50"/></div>
                                
                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">Lat</label><input required type="number" step="any" name="lt" defaultValue={ed.lat||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none focus:border-amber-400/50"/></div>
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">Lon</label><input required type="number" step="any" name="ln" defaultValue={ed.lon||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none focus:border-amber-400/50"/></div>
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">UTC</label><input required type="number" step="any" name="ut" defaultValue={ed.utcOffset||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm outline-none focus:border-amber-400/50"/></div>
                                </div>
                                
                                <div className="pt-3 border-t border-white/10">
                                    <div className="text-[10px] t40 uppercase font-mono mb-3 tracking-widest text-center">Spiritual Lineage (Sankalp)</div>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div><label className="fs9 t50 uppercase font-mono mb-1 block">Gotra</label><input name="gt" defaultValue={ed.gotra||""} placeholder="e.g. Kashyapa" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400/50"/></div>
                                        <div><label className="fs9 t50 uppercase font-mono mb-1 block">Jaati / Varg</label><input name="jt" defaultValue={ed.jaati||""} placeholder="e.g. Hindu" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400/50"/></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div><label className="fs9 t50 uppercase font-mono mb-1 block">Kul Devta</label><input name="kd" defaultValue={ed.kulDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400/50"/></div>
                                        <div><label className="fs9 t50 uppercase font-mono mb-1 block">Gram Devta</label><input name="gd" defaultValue={ed.gramDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400/50"/></div>
                                    </div>
                                    <div><label className="fs9 t50 uppercase font-mono mb-1 block">Sthan Devta (Local Deity)</label><input name="sd" defaultValue={ed.sthanDevta||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400/50"/></div>
                                </div>
                                
                                <button type="submit" className="w-full bg-amber-400 text-black font-semibold rounded-full py-3 mt-4 hover:bg-amber-300 transition shadow-lg shadow-amber-400/20">Save Profile</button>
                            </form>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    
    const root = window.ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<AppContent/>);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            const gt = document.getElementById('google_translate_element');
            const gtm = document.getElementById('google_translate_element_mobile');
            if(window.innerWidth < 640 && gt && gtm) {
                gtm.appendChild(gt.firstChild);
            }
        }, 1000);
    });
  </script>
</body>
</html>
