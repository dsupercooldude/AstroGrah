    const CryptoUtils = {
        b64E: (str) => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1))),
        b64D: (str) => decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')),

    const AppDB = {

      clearConfig() { this.config = null; try { localStorage.removeItem('gh_db_config'); localStorage.removeItem('gh_use_local'); } catch(e){} },

      enableLocal() { this.useLocal = true; try { localStorage.setItem('gh_use_local', 'true'); } catch(e){} },
      
      async callApi(method, path, body = null) {
        if (!this.config) throw new Error("GitHub DB not configured.");
        const qs = method === 'GET' ? `?t=${Date.now()}` : '';
        const url = `https://api.github.com/repos/${this.config.owner}/${this.config.repo}/contents/${path}${qs}`;

        if (body) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });

      async getFile(filename) {

      async saveFile(filename, contentObj, sha, retryCount = 0) {
          if(this.useLocal) { try { localStorage.setItem(filename, JSON.stringify(contentObj)); } catch(e){} return; }
          try { await this.callApi('PUT', filename, { message: `Sync: ${filename}`, content: CryptoUtils.b64E(JSON.stringify(contentObj, null, 2)), ...(sha ? { sha } : {}) }); }

    function norm360(x) { let v = x % 360; return v < 0 ? v + 360 : v; }
    function toRad(d) { return (d * Math.PI) / 180; }
    function julianDay(dStr, tStr, utc) { const [Y,M,D]=(dStr||"2026-01-01").split("-").map(Number); const [h,m]=(tStr||"12:00").split(":").map(Number); return (Date.UTC(Y,M-1,D,h,m,0) - ((utc||0)*3600000)) / 86400000 + 2440587.5; }
    function getAya(Y) { return 23.85 + (Y - 2000) * 0.013972; }
    function sunLon(T) { const M = norm360(357.529 + 35999.05*T); const L = norm360(280.466 + 36000.77*T + 1.915*Math.sin(toRad(M))); return {L, R: 1.00014 - 0.01671*Math.cos(toRad(M))}; }
    function moonLon(T) { const D=norm360(297.85+445267.11*T), M=norm360(357.52+35999.05*T), Mp=norm360(134.96+477198.86*T); return norm360(218.316+481267.88*T + 6.28*Math.sin(toRad(Mp)) + 1.27*Math.sin(toRad(2*D-Mp))); }

    function helio(n, T) { const p=PE[n], a=p.a, e=p.e, i=toRad(p.i), L=p.L[0]+p.L[1]*T, peri=p.peri, node=p.node; const w=toRad(norm360(peri-node)), Om=toRad(norm360(node)), M=toRad(norm360(L-peri)); const E=M+e*Math.sin(M); const xo=a*(Math.cos(E)-e), yo=a*Math.sqrt(1-e*e)*Math.sin(E); const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(Om),so=Math.sin(Om),ci=Math.cos(i); return { x: (co*cw-so*sw*ci)*xo + (-co*sw-so*cw*ci)*yo, y: (so*cw+co*sw*ci)*xo + (-so*sw+co*cw*ci)*yo }; }

    function getKPLords(lon) {
        const nakIdx = Math.floor(lon / (360/27));
        const remInNak = lon % (360/27);
        const subLordIdx = (Math.floor(remInNak / ((360/27)/9)) + (nakIdx % 9)) % 9;
        return { starLord: PLANET_LORDS[nakIdx % 9], subLord: PLANET_LORDS[subLordIdx], subSubLord: PLANET_LORDS[(subLordIdx + 2) % 9] };
    }

    function formatYM(decimalYear) {
        const year = Math.floor(decimalYear);
        const month = Math.round((decimalYear - year) * 12);
        const d = new Date(year, month);
        return d.toLocaleDateString('en-US', {month: 'short', year: 'numeric'});

    function calcDasha(moonDeg, dobStr) {
        const nakLen = 360 / 27; const nakIdx = Math.floor(moonDeg / nakLen); const passedPct = (moonDeg % nakLen) / nakLen;
        let lordIdx = nakIdx % 9; const mahaYrs = VIMSHOTTARI_YEARS[PLANET_LORDS[lordIdx]];
        const bDate = new Date(dobStr); let startYear = bDate.getFullYear() + (bDate.getMonth()/12) - (mahaYrs * passedPct);
        const periods = []; 
        for (let i = 0; i < 9; i++) { 
            const lrd = PLANET_LORDS[(lordIdx + i) % 9]; const dur = VIMSHOTTARI_YEARS[lrd]; 
            periods.push({ lord: lrd, start: startYear, end: startYear + dur }); startYear += dur; 
        }
        return periods;
    }

    function getAntardashas(mahaLord, mahaStart, mahaEnd) {
        const periods = []; const mahaYears = VIMSHOTTARI_YEARS[mahaLord];
        let currentStart = mahaStart; let lordIdx = PLANET_LORDS.indexOf(mahaLord);
        for(let i=0; i<9; i++) {
            const antarLord = PLANET_LORDS[(lordIdx + i) % 9];
            const antarYears = (mahaYears * VIMSHOTTARI_YEARS[antarLord]) / 120;
            periods.push({ lord: antarLord, start: currentStart, end: currentStart + antarYears });
            currentStart += antarYears;
        }
        return periods;
    }

    function getPratyantarDashas(antarLord, antarStart, antarEnd) {
        const periods = []; const antarYears = antarEnd - antarStart;

        for(let i=0; i<9; i++) {
            const pLord = PLANET_LORDS[(lordIdx + i) % 9];

        if(!profile) return null;
        const targetDate = dateObj || new Date();
        const JD = julianDay(profile.dob, profile.time, profile.utcOffset); const T = (JD-2451545)/36525;
        const [Y,Mo] = (profile.dob||"2026-01-01").split("-").map(Number); const aya = getAya(Y+(Mo-1)/12);
        
        const s = sunLon(T); const e = {x: s.R*Math.cos(toRad(norm360(s.L+180))), y: s.R*Math.sin(toRad(norm360(s.L+180)))};
        const sid = { Sun: norm360(s.L-aya), Moon: norm360(moonLon(T)-aya), Rahu: norm360(norm360(125.04-1934.13*T)-aya) };
        sid.Ketu = norm360(sid.Rahu+180);
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,T); sid[p] = norm360(Math.atan2(h.y-e.y, h.x-e.x)*180/Math.PI - aya); });
        
        const [hh,mm]=(profile.time||"12:00").split(":").map(Number); const ascL = norm360(sid.Sun + ((hh+mm/60)-6)*15);
        
        const getDiv = (lon, div) => {
            if(div===1) return SIGNS[Math.floor(lon/30)];
            if(div===7) return SIGNS[ ( (Math.floor(lon/30)%2!==0 ? Math.floor(lon/30)+6 : Math.floor(lon/30)) + Math.floor((lon%30)/(30/7)) ) % 12 ]; 
            if(div===9) return SIGNS[ ( [0,9,6,3,0,9,6,3,0,9,6,3][Math.floor(lon/30)] + Math.floor((lon%30)/(30/9)) ) % 12 ];
            if(div===10) return SIGNS[ ( (Math.floor(lon/30)%2!==0 ? Math.floor(lon/30)+8 : Math.floor(lon/30)) + Math.floor((lon%30)/3) ) % 12 ];
            if(div===60) return SIGNS[ Math.floor((lon*60)/30) % 12 ];
        };
        const genC = (div) => {
            const lg=getDiv(ascL,div); const idx=SIGNS.indexOf(lg);
            const hs={}, pl={}; for(let i=1;i<=12;i++){ hs[i]=SIGNS[(idx+i-1)%12]; }
            Object.entries(sid).forEach(([p, l]) => pl[p] = ((SIGNS.indexOf(getDiv(l,div))-idx+12)%12)+1);
            return { lagna: lg, houses: hs, placements: pl };
        };

        const kpTable = Array.from({length: 12}).map((_, i) => {
            const cuspDegree = norm360(ascL + i*30);
            return { cusp: i+1, sign: SIGNS[Math.floor(cuspDegree / 30)], deg: (cuspDegree % 30).toFixed(2), ...getKPLords(cuspDegree) };
        });

        const shadbala = {
            Sun: Math.floor(Math.abs(Math.sin(toRad(sid.Sun)))*100), Moon: Math.floor(Math.abs(Math.cos(toRad(sid.Moon)))*100),
            Mars: Math.floor(Math.abs(Math.sin(toRad(sid.Mars)))*100), Mercury: Math.floor(Math.abs(Math.cos(toRad(sid.Mercury)))*100),
            Jupiter: Math.floor((sid.Jupiter%180)/180 * 100), Venus: Math.floor((sid.Venus%180)/180 * 100), Saturn: Math.floor((sid.Saturn%180)/180 * 100)
        };

        const dasha = calcDasha(sid.Moon, profile.dob);
        const moonIdx = Math.floor(sid.Moon/(360/27));
        
        const trJD = julianDay(targetDate.toISOString().slice(0,10), "12:00", profile.utcOffset); const trT = (trJD-2451545)/36525;
        const ts = sunLon(trT); const te = {x: ts.R*Math.cos(toRad(norm360(ts.L+180))), y: ts.R*Math.sin(toRad(norm360(ts.L+180)))};
        const transits = { Sun: SIGNS[Math.floor(norm360(ts.L-aya)/30)], Moon: SIGNS[Math.floor(norm360(moonLon(trT)-aya)/30)] };
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,trT); transits[p] = SIGNS[Math.floor(norm360(Math.atan2(h.y-te.y, h.x-te.x)*180/Math.PI - aya)/30)]; });

        return { 
            d1: genC(1), d7: genC(7), d9: genC(9), d10: genC(10), d60: genC(60), kpTable,
            moonSign: SIGNS[Math.floor(sid.Moon/30)], sunSign: SIGNS[Math.floor(sid.Sun/30)], 
            nak: NAKSHATRAS[moonIdx], pada: Math.floor((sid.Moon%(360/27))/((360/27)/4))+1, 
            planetaryDegrees: sid, transits, dasha, shadbala
        };
    }

    function generateDeepGochara(ch, lagnaSign, date, pK, bScores) {
        const transits = ch.transits;
        const ascIdx = SIGNS.indexOf(lagnaSign);
        const getPlanetInHouse = (houseOffset) => {
            const targetSign = SIGNS[(ascIdx + houseOffset - 1) % 12];
            return Object.entries(transits).filter(([,sign]) => sign === targetSign).map(([p]) => p);
        };

        const h1 = getPlanetInHouse(1); const h2 = getPlanetInHouse(2); const h4 = getPlanetInHouse(4); const h6 = getPlanetInHouse(6);
        const h7 = getPlanetInHouse(7); const h10 = getPlanetInHouse(10); const h11 = getPlanetInHouse(11); const h12 = getPlanetInHouse(12);

        const hScore = Math.min(98, Math.max(35, Math.floor(70 + (bScores.p/100) * 25 + (h1.includes("Jupiter")? 10 : 0) - (h6.includes("Mars")? 15 : 0))));
        const wScore = Math.min(98, Math.max(35, Math.floor(65 + (bScores.i/100) * 20 + (h2.includes("Jupiter") || h11.includes("Venus")? 15 : 0) - (h12.includes("Rahu")? 15 : 0))));
        const cScore = Math.min(98, Math.max(35, Math.floor(72 + (bScores.i/100) * 15 + (h10.includes("Sun") || h10.includes("Mars")? 15 : 0))));
        const fScore = Math.min(98, Math.max(35, Math.floor(68 + (bScores.e/100) * 25 + (h4.includes("Moon") || h4.includes("Venus")? 10 : 0))));

        const health = h1.includes("Saturn") || h6.includes("Mars") ? "Saturn/Mars transits in key health houses suggest prioritizing rest. Joint care required." : (h1.includes("Jupiter") ? "Jupiter transiting Lagna grants immense vitality and divine protection today." : "Steady prana flow. Solar alignments encourage early morning physical exertion.");
        const wealth = h2.includes("Jupiter") || h11.includes("Venus") ? "Auspicious Dhan Yoga active via transit! Excellent day for investments and contracting." : (h12.includes("Rahu") ? "Rahu induces unexpected expenses. Audit digital transactions carefully." : "Financial parameters stable. Mercury's position supports slow, analytical wealth planning.");
        const career = h10.includes("Sun") || h10.includes("Mars") ? "Powerful Digbala (Directional Strength) in the 10th House. Highly authoritative day for career." : "Focus on backend strategy. Avoid direct confrontations with management today.";
        const home = h4.includes("Moon") || h4.includes("Venus") ? "Harmonious domestic aura. Auspicious for property matters and maternal connection." : "Practice mindful patience during family discourse to avoid minor friction.";

        return { health: { text: health, sc: hScore }, wealth: { text: wealth, sc: wScore }, career: { text: career, sc: cScore }, home: { text: home, sc: fScore } };
    }

    function AuthModal({ onLogin, onReset }) {

        const [mfaPin, setMfaPin] = useState("");
        
        const proceedToVault = async (normE, emailHash, reqChange) => {
            const vaultFile = await AppDB.getFile(`gl_vault_${emailHash}.json`);
            const prof = typeof vaultFile.content.profiles === 'string' ? CryptoUtils.decrypt(vaultFile.content.profiles) : (vaultFile.content.profiles || []);
            const sett = typeof vaultFile.content.settings === 'string' ? CryptoUtils.decrypt(vaultFile.content.settings) : (vaultFile.content.settings || {});
            onLogin({ email: normE, emailHash, profiles: prof, settings: sett, requiresPasswordChange: reqChange });
        };

        const handleSubmit = async (ev) => { 
            ev.preventDefault(); setErr(""); const normE = e.trim().toLowerCase(); 
            try { 
                const emailHash = await AppDB.hashKey(normE);
                let authFile = await AppDB.getFile('gl_auth.json');
                if(!authFile.content.users) authFile.content.users = {};
                
                if(mode === "signup") { 
                    if(authFile.content.users[emailHash]) throw new Error("Email already registered."); 
                    const gen="Om-"+Math.random().toString(36).slice(-6)+"!"; 
                    const hashedPw = await CryptoUtils.hashPassword(gen); 
                    authFile.content.users[emailHash] = { p: hashedPw, req: true }; 
                    await AppDB.saveFile('gl_auth.json', authFile.content, authFile.sha); 
                    setGp(gen); setMode("generated");
                } else if(mode === "login") { 
                    const u = authFile.content.users[emailHash]; 
                    if(!u) { if (Object.keys(authFile.content.users).length === 0) throw new Error("Empty Vault! Please Sign Up."); throw new Error("Account not found."); } 
                    const hashedInput = await CryptoUtils.hashPassword(p); 
                    if(u.p !== p && u.p !== hashedInput) throw new Error("Invalid password."); 
                    if (u.mfa) { setMode("mfa"); return; }
                    await proceedToVault(normE, emailHash, u.req); 
                }
            } catch(error) { setErr(error.message); }
        };

        const handleMfaSubmit = async (ev) => {
            ev.preventDefault(); setErr(""); const normE = e.trim().toLowerCase();
            try {
                const emailHash = await AppDB.hashKey(normE);
                let authFile = await AppDB.getFile('gl_auth.json');
                const u = authFile.content.users[emailHash];
                const secret = CryptoUtils.decrypt(u.mfa);
                if (!window.OTPAuth) throw new Error("Authenticator library missing.");

                if (totp.validate({ token: mfaPin, window: 1 }) === null) throw new Error("Invalid 2FA PIN.");

        return (

        useEffect(()=>{ if(AppDB.loadConfig()) setDbC(true); },[]);
        const resetConfig = () => { AppDB.clearConfig(); setDbC(false); setU(null); };

        const prs = u?.profiles || []; const set = u?.settings || { aiModel: "offline", monthSystem: "amanta", kundaliStyle: "north", apiKeys: {} };
        const chs = useMemo(()=>{ const o={}; if(prs) { prs.forEach(p=>o[p.id]=computeKundli(p, dt)); } return o; }, [prs, dt]);
        const aP = prs.find(p=>p.id===activeProfileId) || (prs.length > 0 ? prs[0] : null);

        if(!dbC) return <SetupModal onConfig={()=>setDbC(true)}/>;
        if(!u) return <AuthModal onLogin={(d)=>{ setU(d); if(d?.profiles?.length) setActiveProfileId(d.profiles[0].id); }} onReset={resetConfig}/>;
        if(u?.requiresPasswordChange) return <ForcePasswordChange email={u.email} emailHash={u.emailHash} onComplete={() => setU({...u, requiresPasswordChange: false})} />;

        const hSave = async(e) => {
            e.preventDefault(); const f=e.target;
            const pD = { name: f.nm.value, dob: f.dob.value, time: f.tm.value, place: f.pl.value, lat: parseFloat(f.lt.value), lon: parseFloat(f.ln.value), utcOffset: parseFloat(f.ut.value), gotra: f.gt.value, jaati: f.jt.value, kulDevta: f.kd.value, gramDevta: f.gd.value, sthanDevta: f.sd.value, id: ed.id || Date.now().toString() };
            const nP = ed.id ? prs.map(p=>p.id===pD.id?pD:p) : [...prs, pD];
            
            const vaultFile = await AppDB.getFile(`gl_vault_${u.emailHash}.json`);
            vaultFile.content.profiles = CryptoUtils.encrypt(nP);
            vaultFile.content.settings = vaultFile.content.settings || CryptoUtils.encrypt(set);
            await AppDB.saveFile(`gl_vault_${u.emailHash}.json`, vaultFile.content, vaultFile.sha);
            
            setU({...u, profiles:nP}); setActiveProfileId(pD.id); setEd(null);
        };
        
        const deleteProfile = async (id) => { 
            if (!confirm("Are you sure?")) return; const nP = prs.filter(p=>p.id!==id); 
            const vaultFile = await AppDB.getFile(`gl_vault_${u.emailHash}.json`);
            vaultFile.content.profiles = CryptoUtils.encrypt(nP);
            await AppDB.saveFile(`gl_vault_${u.emailHash}.json`, vaultFile.content, vaultFile.sha);
            setU({...u, profiles:nP}); if (nP.length > 0) setActiveProfileId(nP[0].id); 
        };

        const updateSettings = async (ns) => {
            const vaultFile = await AppDB.getFile(`gl_vault_${u.emailHash}.json`);
            vaultFile.content.settings = CryptoUtils.encrypt(ns);
            vaultFile.content.profiles = vaultFile.content.profiles || CryptoUtils.encrypt(prs);
            await AppDB.saveFile(`gl_vault_${u.emailHash}.json`, vaultFile.content, vaultFile.sha);
            setU({...u, settings:ns});
        }

        const enableMFA = () => {
            const secret = new window.OTPAuth.Secret({ size: 20 }).base32;
            const totp = new window.OTPAuth.TOTP({ issuer: "Graha Ledger", label: u.email, algorithm: "SHA1", digits: 6, period: 30, secret: secret });
            const uri = totp.toString();
            if (window.QRCode) {
                window.QRCode.toDataURL(uri, (err, url) => { setMfaSetup({ secret, qr: url, pin: '' }); });
            } else {
                setMfaSetup({ secret, qr: `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(uri)}`, pin: '' });
            }
        }

        const verifyAndSaveMfa = async () => {
            if (!window.OTPAuth) return alert("Authenticator validation engine offline.");
            const totp = new window.OTPAuth.TOTP({ secret: mfaSetup.secret });
            if (totp.validate({ token: mfaSetup.pin, window: 1 }) === null) return alert("Invalid PIN. Please try again.");
            const authDB = await AppDB.getFile('gl_auth.json');
            authDB.content.users[u.emailHash].mfa = CryptoUtils.encrypt(mfaSetup.secret);
            await AppDB.saveFile('gl_auth.json', authDB.content, authDB.sha);
            alert("MFA Enabled Successfully! Your vault is now locked."); setMfaSetup(null);
        }

        const fetchCityCoordinates = async () => {
            const cityInput = document.getElementById("searchCityInput").value;
            if(!cityInput) return alert("Please enter a city name first.");
            document.getElementById("fetchBtn").innerText = "Searching...";
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityInput)}&format=json&limit=1`);
                const data = await res.json();
                if(data && data.length > 0) {
                    document.querySelector('input[name="lt"]').value = parseFloat(data[0].lat).toFixed(4);
                    document.querySelector('input[name="ln"]').value = parseFloat(data[0].lon).toFixed(4);
                    document.querySelector('input[name="pl"]').value = data[0].display_name.split(",")[0];
                } else { alert("City not found. Try a broader search."); }
            } catch(e) { alert("Search failed."); }
            document.getElementById("fetchBtn").innerText = "Auto-Fetch";
        }

        return (
            <div className="min-h-screen w-full font-sans pb-10 relative">
                <div className="bgcard2 border-b border-white/10 sticky top-0 z-30 shadow-lg">
                    <div className="mx-auto max-w-md sm:max-w-3xl px-4 py-3 flex justify-between items-center pr-36">
                        <div className="flex items-center gap-3"><SageLogo size={32}/><div><h1 className="font-serif text-lg text-amber-300 leading-tight">Graha Ledger V2.5</h1><div className="text-[9px] font-mono t50 uppercase tracking-widest">{u.email}</div></div></div>
                        <div className="flex items-center gap-2">
                            {prs.length > 1 && ( <select value={aP?.id||""} onChange={e=>setActiveProfileId(e.target.value)} className="bg-black/40 border border-white/10 rounded-xl px-2 py-1.5 font-serif text-xs text-amber-200 outline-none">{prs.map(p=><option key={p.id} value={p.id}>{p.name.split(' ')[0]}</option>)}</select> )}
                            <button onClick={()=>setEd({})} title="Add Profile" className="p-2 rounded-full border border-white/10 bg-black/30 hover:bg-white/10 transition text-amber-300"><Icon name="user-plus" size={17}/></button>
                            <button onClick={()=>setSs(true)} title="Settings" className="p-2 rounded-full border border-white/10 bg-black/30 hover:bg-white/10 transition text-amber-300"><Icon name="gear" size={17}/></button>
                            <button onClick={resetConfig} title="Logout" className="p-2 rounded-full border border-white/10 bg-black/30 hover:bg-white/10 transition text-red-400"><Icon name="sign-out" size={17}/></button>
                        </div>
                    </div>
                </div>

                <div className="mx-auto max-w-md sm:max-w-3xl px-4 py-6 relative z-10">
                    {prs.length===0 ? ( <div className="text-center p-8 border border-dashed border-white/20 rounded-3xl mt-10 bgfaint gl-fadein"><h2 className="font-serif text-2xl mb-2 text-amber-300">Welcome to Graha Ledger</h2><button onClick={()=>setEd({})} className="px-8 py-3 rounded-full bg-amber-400 text-black text-sm font-semibold hover:bg-amber-300 mt-4">Create Natal Profile</button></div> ) : (
                        <Fragment>
                            <div className="flex gap-1 overflow-x-auto rounded-2xl border border-white/10 bgcard p-1 font-mono text-[11px] shadow-inner mb-2">
                                {[{id:"person",l:"Astrology"},{id:"panchang",l:"Panchang"},{id:"union",l:"Union"},{id:"ask",l:"AI Sage"}].map(t=><button key={t.id} onClick={()=>setTb(t.id)} className={`flex-1 whitespace-nowrap rounded-xl px-3 py-2.5 transition ${tb===t.id?"bg-amber-400/20 text-amber-300 font-bold shadow":"t50 hover:t100"}`}>{t.l}</button>)}
                            </div>
                            {tb==="person" && <PersonTab pr={aP} ch={chs[aP?.id]} date={dt} setDate={setDt} settings={set} onEditProfile={setEd}/>}
                            {tb==="panchang" && <PanchangTab d={dt} p={aP} utc={aP?.utcOffset||5.5} settings={set}/>}
                            {tb==="union" && <CompatTab prs={prs} chs={chs} settings={set} date={dt}/>}
                            {tb==="ask" && <AskTab em={u.email} emHash={u.emailHash} set={set} pr={aP} ch={chs[aP?.id]}/>}
                        </Fragment>
                    )}

                    {ss && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4" onClick={()=>setSs(false)}>
                            <div onClick={e=>e.stopPropagation()} className="w-full max-w-md p-6 rounded-3xl border border-white/10 bgcard2 space-y-5 max-h-[85vh] overflow-y-auto gl-fadein shadow-2xl relative">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3"><h3 className="font-serif text-lg text-white">Security & App Vault</h3><button onClick={()=>setSs(false)} className="p-1 rounded-full hover:bg-white/10 transition"><Icon name="x"/></button></div>
                                
                                <div>
                                    <label className="text-[9px] font-mono uppercase text-emerald-400 mb-1.5 block">2FA Authenticator Setup</label>
                                    {!mfaSetup && <button type="button" onClick={enableMFA} className="w-full py-2 bg-emerald-500/20 text-emerald-300 font-semibold rounded-xl text-xs hover:bg-emerald-500/30 transition border border-emerald-500/30">Enable 2FA Authenticator App</button>}
                                    {mfaSetup && (
                                        <div className="bg-black/40 p-3 rounded-xl border border-emerald-500/30 text-center">
                                            <img src={mfaSetup.qr} alt="QR Code" className="w-32 h-32 mx-auto rounded-lg mb-2 shadow-lg bg-white p-1"/>
                                            <div className="text-[9px] font-mono t85 mb-3 select-all">Secret: {mfaSetup.secret}</div>
                                            <input value={mfaSetup.pin} onChange={e=>setMfaSetup({...mfaSetup, pin: e.target.value})} maxLength="6" placeholder="Enter 6-digit PIN" className="w-full text-center tracking-[0.5em] font-mono font-bold bg-black/50 border border-white/10 rounded-lg px-2 py-2 text-sm outline-none text-emerald-300 focus:border-emerald-400/50 mb-3"/>
                                            <button type="button" onClick={verifyAndSaveMfa} className="w-full py-2 bg-emerald-500 text-black font-semibold rounded-lg text-xs hover:bg-emerald-400 transition">Verify & Activate</button>
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="text-[9px] font-mono uppercase t50 mb-1.5 block">Default Kundali Style</label><select value={set.kundaliStyle} onChange={e=> updateSettings({...set,kundaliStyle:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none text-white"><option value="north">North Indian</option><option value="south">South Indian</option><option value="east">East Indian</option><option value="kp">KP System</option></select></div>
                                    <div className="notranslate"><label className="text-[9px] font-mono uppercase t50 mb-1.5 block">Month System</label><select value={set.monthSystem} onChange={e=> updateSettings({...set,monthSystem:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none text-white notranslate"><option value="amanta">Amanta (Amavasya)</option><option value="purnimanta">Purnimanta (Purnima)</option></select></div>
                                </div>

                                <div>
                                    <label className="text-[9px] font-mono uppercase t50 mb-1.5 block">AI Provider Engine</label>
                                    <select value={set.aiModel} onChange={e=> updateSettings({...set,aiModel:e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none text-white">
                                        <option value="offline">Offline Global Engine (100% Local)</option><option value="gemini">Google Gemini 1.5 Flash</option><option value="openai">OpenAI (GPT-4o Mini)</option><option value="kimi">Moonshot / Kimi</option><option value="deepseek">DeepSeek AI</option>
                                    </select>
                                </div>

                                <div className="p-4 border border-amber-500/30 bg-amber-950/10 rounded-2xl space-y-2.5">
                                    <label className="text-[10px] text-amber-400 font-mono uppercase block">Encrypted Fallback API Keys</label>
                                    <div><div className="flex justify-between text-[8px] t50 mb-0.5 font-mono"><span>Gemini Key</span><a href="https://aistudio.google.com/app/apikey" target="_blank" className="hover:text-amber-300" title="Get Gemini Key"><Icon name="question"/></a></div><input type="password" value={set.apiKeys?.gemini||""} onChange={e=> updateSettings({...set,apiKeys:{...set.apiKeys,gemini:e.target.value}})} placeholder="AIzaSy..." className="w-full bg-black/50 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                    <div><div className="flex justify-between text-[8px] t50 mb-0.5 font-mono"><span>OpenAI Key</span><a href="https://platform.openai.com/api-keys" target="_blank" className="hover:text-amber-300" title="Get OpenAI Key"><Icon name="question"/></a></div><input type="password" value={set.apiKeys?.openai||""} onChange={e=> updateSettings({...set,apiKeys:{...set.apiKeys,openai:e.target.value}})} placeholder="sk-..." className="w-full bg-black/50 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                    <div><div className="flex justify-between text-[8px] t50 mb-0.5 font-mono"><span>Kimi Key</span><a href="https://platform.moonshot.cn/console/api-keys" target="_blank" className="hover:text-amber-300" title="Get Kimi Key"><Icon name="question"/></a></div><input type="password" value={set.apiKeys?.kimi||""} onChange={e=> updateSettings({...set,apiKeys:{...set.apiKeys,kimi:e.target.value}})} placeholder="sk-..." className="w-full bg-black/50 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                    <div><div className="flex justify-between text-[8px] t50 mb-0.5 font-mono"><span>DeepSeek Key</span><a href="https://platform.deepseek.com/api_keys" target="_blank" className="hover:text-amber-300" title="Get DeepSeek Key"><Icon name="question"/></a></div><input type="password" value={set.apiKeys?.deepseek||""} onChange={e=> updateSettings({...set,apiKeys:{...set.apiKeys,deepseek:e.target.value}})} placeholder="sk-..." className="w-full bg-black/50 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {ed && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/80 p-4" onClick={()=>setEd(null)}>
                            <form onClick={e=>e.stopPropagation()} onSubmit={hSave} className="w-full max-w-md bgcard2 rounded-3xl border border-white/10 p-6 space-y-3.5 max-h-[90vh] overflow-y-auto gl-fadein shadow-2xl relative">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="font-serif text-lg text-white">{ed.id?"Modify Profile Details":"Create Natal Profile"}</h3>
                                    {ed.id && <button type="button" onClick={()=>deleteProfile(ed.id)} className="text-[10px] text-red-400 font-mono border border-red-400/30 px-2 py-1 rounded">Delete</button>}
                                </div>
                                <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Full Name</label><input required name="nm" defaultValue={ed.name||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none text-white"/></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Date of Birth</label><input required type="date" name="dob" defaultValue={ed.dob||"2000-01-01"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none text-white"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Time (24h)</label><input required type="time" name="tm" defaultValue={ed.time||"12:00"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none text-white"/></div>
                                </div>
                                
                                <div className="pt-2 border-t border-white/10">
                                    <label className="text-[9px] t50 uppercase font-mono mb-1 flex justify-between items-center">
                                        <span>GPS Auto-Locate</span>
                                        <button type="button" onClick={()=>{ if(navigator.geolocation) { navigator.geolocation.getCurrentPosition(async pos => { document.querySelector('input[name="lt"]').value = pos.coords.latitude.toFixed(4); document.querySelector('input[name="ln"]').value = pos.coords.longitude.toFixed(4); document.querySelector('input[name="ut"]').value = (-new Date().getTimezoneOffset() / 60).toFixed(1); try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`); const d = await r.json(); document.querySelector('input[name="pl"]').value = d.address.city || d.address.town || d.address.village || 'Auto GPS Location'; } catch(e){ document.querySelector('input[name="pl"]').value = 'GPS Coord'; } }); } else alert('Geolocation not supported'); }} className="text-amber-300 hover:text-amber-200">Use GPS <Icon name="crosshair"/></button>
                                    </label>
                                </div>

                                <div>
                                    <label className="text-[9px] t50 uppercase font-mono mb-1 block">Birth Place Name / Auto-Fetch</label>
                                    <div className="flex gap-2">
                                        <input required list="cities" id="searchCityInput" name="pl" defaultValue={ed.place||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm outline-none text-white" placeholder="Type city name..." />
                                        <datalist id="cities">
                                            {CITY_PRESETS.map(c=><option key={c.name} value={c.name} />)}
                                        </datalist>
                                        <button type="button" id="fetchBtn" onClick={fetchCityCoordinates} className="px-3 py-2 bg-white/10 rounded-xl text-xs hover:bg-white/20 transition">Search</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Latitude</label><input required type="number" step="any" name="lt" defaultValue={ed.lat||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-xs outline-none text-white"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">Longitude</label><input required type="number" step="any" name="ln" defaultValue={ed.lon||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-xs outline-none text-white"/></div>
                                    <div><label className="text-[9px] t50 uppercase font-mono mb-1 block">UTC Offset</label><input required type="number" step="any" name="ut" defaultValue={ed.utcOffset||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-xs outline-none text-white"/></div>
                                </div>
                                <div className="pt-2 border-t border-white/10">
                                    <div className="text-[10px] text-amber-400 uppercase font-mono mb-2 tracking-widest text-center">Spiritual Lineage (Optional)</div>
                                    <div className="grid grid-cols-2 gap-2 mb-2">
                                        <div><label className="text-[8px] t50 uppercase font-mono mb-1 block">Gotra</label><input name="gt" defaultValue={ed.gotra||""} placeholder="e.g. Kashyapa" className="w-full bg-black/40 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                        <div><label className="text-[8px] t50 uppercase font-mono mb-1 block">Jaati / Varg</label><input name="jt" defaultValue={ed.jaati||""} placeholder="e.g. Brahmin" className="w-full bg-black/40 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mb-2">
                                        <div><label className="text-[8px] t50 uppercase font-mono mb-1 block">Kul Devta</label><input name="kd" defaultValue={ed.kulDevta||""} placeholder="e.g. Chamunda" className="w-full bg-black/40 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                        <div><label className="text-[8px] t50 uppercase font-mono mb-1 block">Gram Devta</label><input name="gd" defaultValue={ed.gramDevta||""} placeholder="e.g. Bhairava" className="w-full bg-black/40 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                    </div>
                                    <div><label className="text-[8px] t50 uppercase font-mono mb-1 block">Sthan Devta</label><input name="sd" defaultValue={ed.sthanDevta||""} placeholder="e.g. Hanumanji" className="w-full bg-black/40 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs outline-none text-white"/></div>
                                </div>
                                <button type="submit" className="w-full bg-amber-400 text-black font-semibold rounded-full py-3 mt-2 hover:bg-amber-300 transition shadow-lg shadow-amber-400/20">Save Encrypted Vault Profile</button>
                            </form>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    
    const root = React.StrictMode ? window.ReactDOM.createRoot(document.getElementById('root')) : null;
    if(root) root.render(<ErrorBoundary><AppContent/></ErrorBoundary>);
  </script>
</body>
</html>
