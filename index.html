  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = window.React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, Legend } = window.Recharts;

    const Icon = ({ name, size=16, className, style }) => <i className={`ph ph-${name} ${className||''}`} style={{fontSize: size, ...style}} />;
    
    const SageLogo = ({ size = 64, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
        <circle cx="50" cy="50" r="48" stroke="#D4A574" strokeWidth="1.5" fill="rgba(212,165,116,0.05)"/>
        <path d="M70 30 A 12 12 0 1 0 82 18 A 14 14 0 1 1 70 30 Z" fill="#F2EFE6" opacity="0.8"/>
        <circle cx="30" cy="25" r="1.5" fill="#F2EFE6" opacity="0.6"/>
        <circle cx="40" cy="18" r="1" fill="#F2EFE6" opacity="0.4"/>
        <circle cx="20" cy="40" r="1" fill="#F2EFE6" opacity="0.5"/>
        <path d="M50 35 A 7 7 0 1 1 49.9 35 Z" fill="#F2EFE6" opacity="0.9"/>
        <path d="M35 75 C 35 55, 45 48, 50 48 C 55 48, 65 55, 65 75 L 75 85 L 25 85 Z" fill="#D4A574"/>
        <path d="M30 80 L 40 68 L 50 72 L 60 68 L 70 80" stroke="#1A1C36" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
        <path d="M43 73 L 50 67 L 57 73" stroke="#1A1C36" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
      </svg>
    );

    const GitHubDB = {
      config: null,
      setConfig(owner, repo, token) {
        this.config = { owner, repo, token };
        localStorage.setItem('gh_db_config', JSON.stringify(this.config));
      },
      loadConfig() {
        const conf = localStorage.getItem('gh_db_config');
        if (conf) this.config = JSON.parse(conf);
        return this.config;
      },
      async callApi(method, path, body = null) {
        if (!this.config) throw new Error("GitHub DB not configured.");
        const url = `https://api.github.com/repos/${this.config.owner}/${this.config.repo}/contents/${path}`;
        const headers = { 'Authorization': `token ${this.config.token}`, 'Accept': 'application/vnd.github.v3+json' };
        if (body) headers['Content-Type'] = 'application/json';
        
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
        if (!res.ok && res.status !== 404) throw new Error(`GitHub Error: ${res.statusText}`);
        return res.status === 404 ? null : await res.json();
      },
      async getDB() {
        const data = await this.callApi('GET', 'graha_db.json');
        if (!data) return { sha: null, content: { users: {} } };
        const contentStr = decodeURIComponent(escape(window.atob(data.content)));
        return { sha: data.sha, content: JSON.parse(contentStr) };
      },
      async saveDB(contentObj, sha) {
        const contentStr = JSON.stringify(contentObj, null, 2);
        const encoded = window.btoa(unescape(encodeURIComponent(contentStr)));
        const body = { message: "Graha Ledger Sync", content: encoded, ...(sha ? { sha } : {}) };
        await this.callApi('PUT', 'graha_db.json', body);
      },
      async syncUserData(email, userData) {
        const db = await this.getDB();
        if(!db.content.users) db.content.users = {};
        db.content.users[email] = { ...db.content.users[email], ...userData };
        await this.saveDB(db.content, db.sha);
      }
    };

    const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
    const SIGN_LORDS = { Aries:"Mars", Taurus:"Venus", Gemini:"Mercury", Cancer:"Moon", Leo:"Sun", Virgo:"Mercury", Libra:"Venus", Scorpio:"Mars", Sagittarius:"Jupiter", Capricorn:"Saturn", Aquarius:"Saturn", Pisces:"Jupiter" };
    const NAKSHATRAS = ["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];
    const NAKSHATRA_LORDS = ["Ketu", "Venus", "Sun", "Moon", "Mars", "Rahu", "Jupiter", "Saturn", "Mercury"];
    const LUNAR_MASAS = ["Chaitra", "Vaishakha", "Jyeshtha", "Ashadha", "Shravana", "Bhadrapada", "Ashvin", "Kartika", "Margashirsha", "Pausha", "Magha", "Phalguna"];
    const YOGAS = ["Vishkambha", "Priti", "Ayushman", "Saubhagya", "Shobhana", "Atiganda", "Sukarma", "Dhriti", "Shula", "Ganda", "Vriddhi", "Dhruva", "Vyaghata", "Harshana", "Vajra", "Siddhi", "Vyatipata", "Variyana", "Parigha", "Shiva", "Siddha", "Sadhya", "Shubha", "Shukla", "Brahma", "Indra", "Vaidhriti"];
    const MOVING_KARANAS = ["Bava", "Balava", "Kaulava", "Taitila", "Gara", "Vanija", "Vishti (Bhadra)"];
    const LLM_PROVIDERS = [ { id: "gemini-1.5-flash", name: "Gemini 1.5 Flash" }, { id: "gpt-4o", name: "GPT-4o" }, { id: "claude-3", name: "Claude 3.5 Sonnet" }, { id: "moonshot", name: "Kimi Moonshot" } ];
    const ACCENT_PALETTE = ["#8FB2D9", "#D4A574", "#B7A0D9", "#8FC9A9", "#D99B8F", "#C9C08F"];
    const WEEKDAY_ORDER = ["Sun", "Moon", "Mars", "Mercury", "Jupiter", "Venus", "Saturn"];

    const PLANET_INFO = {
      Sun: { symbol: "☉", name: "Surya", day: "Sunday", deity: "Lord Rama", mantra: "Om Hraam Hreem Hroom Sah Suryaya Namah", color: "#E8A33D", themes: ["clarity", "leadership"], remedy: "Offer Arghya (water) in a copper vessel at dawn." },
      Moon: { symbol: "☽", name: "Chandra", day: "Monday", deity: "Goddess Gauri", mantra: "Om Shraam Shreem Shroom Sah Chandraya Namah", color: "#9FB8D9", themes: ["emotion", "intuition"], remedy: "Wear white or silver accents. Offer pure milk." },
      Mars: { symbol: "♂", name: "Mangal", day: "Tuesday", deity: "Lord Hanuman", mantra: "Om Kraam Kreem Kroom Sah Bhaumaya Namah", color: "#B23A48", themes: ["courage", "decisive action"], remedy: "Recite Hanuman Chalisa. Channel energy into structured workout." },
      Mercury: { symbol: "☿", name: "Budh", day: "Wednesday", deity: "Lord Vishnu", mantra: "Om Braam Breem Broom Sah Budhaya Namah", color: "#7C9473", themes: ["communication", "intellect"], remedy: "Wear green. Feed green gram to cows or birds." },
      Jupiter: { symbol: "♃", name: "Guru", day: "Thursday", deity: "Lord Dakshinamurthy", mantra: "Om Graam Greem Groom Sah Gurave Namah", color: "#D4A574", themes: ["wisdom", "dharma"], remedy: "Donate turmeric, chana dal or yellow sweets to teachers." },
      Venus: { symbol: "♀", name: "Shukra", day: "Friday", deity: "Goddess Lakshmi", mantra: "Om Draam Dreem Droom Sah Shukraya Namah", color: "#C98CA7", themes: ["harmony", "relationships"], remedy: "Offer white flowers or fragrant sweets to Goddess Lakshmi." },
      Saturn: { symbol: "♄", name: "Shani", day: "Saturday", deity: "Lord Shani", mantra: "Om Praam Preem Proom Sah Shanaye Namah", color: "#8288A0", themes: ["discipline", "patience"], remedy: "Light a mustard-oil lamp under a Peepal tree at dusk." },
      Rahu: { symbol: "☊", name: "Rahu", day: "Saturday", deity: "Goddess Durga", mantra: "Om Bhraam Bhreem Bhroom Sah Rahave Namah", color: "#A872B2", themes: ["ambition", "breakthroughs"], remedy: "Maintain clutter-free spaces and feed street dogs." },
      Ketu: { symbol: "☋", name: "Ketu", day: "Tuesday", deity: "Lord Ganesha", mantra: "Om Sraam Sreem Sroom Sah Ketave Namah", color: "#72AAB2", themes: ["detachment", "spiritual depth"], remedy: "Chant 'Om Gam Ganapataye Namah'." }
    };

    const DOMAINS = [
      { key: "health", label: "Health & Vitality", icon: "heart-beat", houses: [1, 6, 8], tag: "Stamina, routine & recovery" },
      { key: "wealth", label: "Wealth & Finance", icon: "wallet", houses: [2, 9, 11], tag: "Assets, liquidity & gains" },
      { key: "career", label: "Career & Work", icon: "briefcase", houses: [10, 2, 6], tag: "Status, leadership & output" },
      { key: "lifestyle", label: "Home & Relationships", icon: "house", houses: [4, 7, 3, 12], tag: "Domestic peace & harmony" },
    ];

    function norm360(x) { if (isNaN(x)) return 0; let v = x % 360; return v < 0 ? v + 360 : v; }
    function toRad(d) { return (d * Math.PI) / 180; }
    function toDeg(r) { return (r * 180) / Math.PI; }
    function signOf(lon) { return SIGNS[Math.floor(norm360(lon) / 30)] || "Aries"; }
    function addDays(date, days) { const result = new Date(date); result.setDate(result.getDate() + days); return result; }
    function planetOfDay(date) { if (!date || isNaN(date)) return "Sun"; return WEEKDAY_ORDER[date.getDay()] || "Sun"; }
    function ordinalSuffix(n) { if ([11, 12, 13].includes(n % 100)) return "th"; switch (n % 10) { case 1: return "st"; case 2: return "nd"; case 3: return "rd"; default: return "th"; } }
    function formatTimeOnly(date) { return date.toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit', hour12: false }); }

    function julianDay(isoDate, timeStr, utcOffset) {
      try {
        const [Y, Mo, D] = (isoDate || "2000-01-01").split("-").map(Number);
        const [hh, mm] = (timeStr || "12:00").split(":").map(Number);
        const ms = Date.UTC(Y, Mo - 1, D, hh, mm, 0) - (utcOffset * 3600000);
        return ms / 86400000 + 2440587.5;
      } catch(e) { return 2451545.0; }
    }

    function sunLongitude(T) {
      const L0 = norm360(280.46646 + 36000.76983 * T);
      const M = norm360(357.52911 + 35999.05029 * T);
      const C = (1.914602 - 0.004817 * T) * Math.sin(toRad(M)) + 0.019993 * Math.sin(toRad(2 * M));
      return { longitude: norm360(L0 + C - 0.00569), trueLong: norm360(L0 + C), R: 1 };
    }

    function moonLongitude(T) {
      const Lp = norm360(218.3164477 + 481267.88123421 * T);
      const D = norm360(297.8501921 + 445267.1114034 * T);
      const M = norm360(357.5291092 + 35999.0502909 * T);
      const Mp = norm360(134.9633964 + 477198.8675055 * T);
      const dL = 6.288774 * Math.sin(toRad(Mp)) + 1.274027 * Math.sin(toRad(2*D - Mp)) + 0.658314 * Math.sin(toRad(2*D));
      return norm360(Lp + dL);
    }
    
    function mockPlanetLongitude(planet, T) {
        if(planet === "Mercury") return norm360(sunLongitude(T).longitude + 15);
        if(planet === "Venus") return norm360(sunLongitude(T).longitude - 20);
        if(planet === "Mars") return norm360(120 + T * 360);
        if(planet === "Jupiter") return norm360(90 + T * 30);
        if(planet === "Saturn") return norm360(330 + T * 12);
        if(planet === "Rahu") return norm360(180 - T * 19);
        return 0;
    }

    function getAyanamsaValue(decimalYear, type = "lahiri") { return (type === "kp" ? 23.90 : 23.85) + (decimalYear - 2000) * 0.013972; }

    function computePanchang(dateObj, monthSystem = "amanta", appUtcOffset = 5.5) {
      try {
        const isoString = (dateObj && !isNaN(dateObj) ? dateObj : new Date()).toISOString().slice(0, 10);
        const JD = julianDay(isoString, "12:00", appUtcOffset);
        const T = (JD - 2451545.0) / 36525;
        const sun = sunLongitude(T);
        const moon = moonLongitude(T);
        
        const diff = norm360(moon - sun.longitude);
        const tithiIndex = Math.floor(diff / 12);
        const tithiNum = (tithiIndex % 15) + 1;
        const isShukla = tithiIndex < 15;
        const paksha = isShukla ? "Shukla" : "Krishna";
        
        const sunSignIdx = Math.floor(norm360(sun.longitude) / 30);
        let masaIdx = sunSignIdx;
        if (monthSystem === "purnimanta" && !isShukla) masaIdx = (sunSignIdx + 1) % 12;
        
        const tithiNames = ["Pratipada", "Dwitiya", "Tritiya", "Chaturthi", "Panchami", "Shashthi", "Saptami", "Ashtami", "Navami", "Dashami", "Ekadashi", "Dwadashi", "Trayodashi", "Chaturdashi", isShukla ? "Purnima" : "Amavasya"];
        const moonLonNormalized = norm360(moon);
        const nakIdx = Math.floor(moonLonNormalized / (360 / 27));
        const nakPada = Math.floor((moonLonNormalized % (360 / 27)) / ((360 / 27) / 4)) + 1;
        const yogaIdx = Math.floor(norm360(moon + sun.longitude) / (360 / 27));
        
        const karanaIdx = Math.floor(diff / 6);
        let karanaName = "";
        if (karanaIdx === 0) karanaName = "Kimstughna";
        else if (karanaIdx >= 1 && karanaIdx <= 56) karanaName = MOVING_KARANAS[(karanaIdx - 1) % 7];
        else if (karanaIdx === 57) karanaName = "Shakuni";
        else if (karanaIdx === 58) karanaName = "Chatushpada";
        else if (karanaIdx === 59) karanaName = "Naga";
        
        return {
          tithiName: tithiNames[tithiNum - 1], tithiNum, paksha, masa: LUNAR_MASAS[masaIdx], monthSystem,
          sunSign: SIGNS[sunSignIdx], moonSign: SIGNS[Math.floor(moonLonNormalized / 30)],
          nakshatra: NAKSHATRAS[nakIdx], nakshatraPada: nakPada,
          yoga: YOGAS[yogaIdx] || "Vishkambha", karana: karanaName,
          isAmavasya: tithiIndex === 29, isPurnima: tithiIndex === 14
        };
      } catch(e) { return { tithiName: "Pratipada", paksha: "Shukla", masa: "Chaitra", nakshatra: "Ashwini", yoga: "Vishkambha", karana: "Bava", isAmavasya: false, isPurnima: false }; }
    }

    function computeKundli(profile, ayanamsaType = "lahiri") {
      if (!profile) return null;
      const JD = julianDay(profile.dob, profile.time, profile.utcOffset);
      const T = (JD - 2451545.0) / 36525;
      const [Y, Mo] = (profile.dob || "2000-01-01").split("-").map(Number);
      const ayanamsa = getAyanamsaValue((Y || 2000) + ((Mo || 1) - 1) / 12, ayanamsaType);

      const tropical = {
        Sun: sunLongitude(T).longitude, Moon: moonLongitude(T), Mercury: mockPlanetLongitude("Mercury", T),
        Venus: mockPlanetLongitude("Venus", T), Mars: mockPlanetLongitude("Mars", T), Jupiter: mockPlanetLongitude("Jupiter", T),
        Saturn: mockPlanetLongitude("Saturn", T), Rahu: mockPlanetLongitude("Rahu", T),
      };
      tropical.Ketu = norm360(tropical.Rahu + 180);

      const sidereal = {};
      Object.keys(tropical).forEach((k) => { sidereal[k] = norm360(tropical[k] - ayanamsa); });
      
      const [hh, mm] = (profile.time || "12:00").split(":").map(Number);
      const hoursSinceSunrise = (hh + mm/60) - 6;
      const ascTropical = norm360(tropical.Sun + (hoursSinceSunrise * 15));
      const lagnaLon = norm360(ascTropical - ayanamsa);
      const lagnaSign = signOf(lagnaLon);
      const lagnaIdx = SIGNS.indexOf(lagnaSign);

      const houses = {}; const lords = {};
      for (let h = 1; h <= 12; h++) { const sign = SIGNS[(lagnaIdx + h - 1) % 12]; houses[h] = sign; lords[h] = SIGN_LORDS[sign]; }
      
      const placements = {}; const kpDetails = {};
      Object.entries(sidereal).forEach(([planet, lon]) => {
        const sIdx = SIGNS.indexOf(signOf(lon));
        placements[planet] = ((sIdx - lagnaIdx + 12) % 12) + 1;
        kpDetails[planet] = { starLord: NAKSHATRA_LORDS[Math.floor(lon / (360/27)) % 9], subLord: NAKSHATRA_LORDS[(Math.floor(lon / (360/27)) + 2) % 9] };
      });

      const moonNakIdx = Math.floor(sidereal.Moon / (360 / 27));
      const moonNakPada = Math.floor((sidereal.Moon % (360 / 27)) / ((360 / 27) / 4)) + 1;

      return { lagna: lagnaSign, lagnaLon, lagnaIdx, moonSign: signOf(sidereal.Moon), nakshatra: NAKSHATRAS[moonNakIdx] || "Ashwini", nakshatraPada: moonNakPada, sunSign: signOf(sidereal.Sun), houses, lords, placements, kpDetails, longitudes: sidereal, ayanamsaUsed: ayanamsa };
    }

    function calculateMuhurta(date, lat, lon) {
      const d = new Date(date);
      d.setHours(6, 0, 0, 0); const sunrise = new Date(d);
      d.setHours(18, 0, 0, 0); const sunset = new Date(d);
      const dayDurationMs = sunset - sunrise;
      const segmentMs = dayDurationMs / 8;
      const dayOfWeek = date.getDay();
      
      const rahuLookup = { 0: 7, 1: 1, 2: 6, 3: 4, 4: 5, 5: 3, 6: 2 };
      const yamaLookup = { 0: 4, 1: 3, 2: 2, 3: 1, 4: 0, 5: 6, 6: 5 };
      const guliLookup = { 0: 6, 1: 5, 2: 4, 3: 3, 4: 2, 5: 1, 6: 0 };
      
      const getSegmentTime = (idx) => { return { start: new Date(sunrise.getTime() + idx * segmentMs), end: new Date(sunrise.getTime() + (idx + 1) * segmentMs) }; };

      const chogTypes = [{name: "Udveg", color: "#B23A48"}, {name: "Amrit", color: "#8FB2D9"}, {name: "Rog", color: "#B23A48"}, {name: "Labh", color: "#8FC9A9"}, {name: "Shubh", color: "#D4A574"}, {name: "Char", color: "#9FB8D9"}, {name: "Kaal", color: "#8288A0"}];
      const chogMatrix = { 0: [0, 5, 3, 1, 2, 4, 6, 0], 1: [1, 2, 4, 6, 0, 5, 3, 1], 2: [2, 4, 6, 0, 5, 3, 1, 2], 3: [3, 1, 2, 4, 6, 0, 5, 3], 4: [4, 6, 0, 5, 3, 1, 2, 4], 5: [5, 3, 1, 2, 4, 6, 0, 5], 6: [6, 0, 5, 3, 1, 2, 4, 6] };
      
      const dayChog = chogMatrix[dayOfWeek].map((tIdx, i) => ({ ...chogTypes[tIdx], ...getSegmentTime(i) }));
      return { rahu: getSegmentTime(rahuLookup[dayOfWeek]), yama: getSegmentTime(yamaLookup[dayOfWeek]), guli: getSegmentTime(guliLookup[dayOfWeek]), dayChog };
    }

    function calculateTimezoneAwareBiorhythm(dobStr, targetDate, userUtcOffset = 0) {
      if (!dobStr) dobStr = "2000-01-01";
      const [Y, M, D] = dobStr.split("-").map(Number);
      const birthTimestamp = Date.UTC(Y || 2000, (M || 1) - 1, D || 1, 12, 0, 0) - (userUtcOffset * 3600 * 1000);
      const targetTimestamp = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate(), 12, 0, 0) - (userUtcOffset * 3600 * 1000);
      const elapsedDays = (targetTimestamp - birthTimestamp) / 86400000;
      return { days: elapsedDays, physical: Math.sin((2 * Math.PI * elapsedDays) / 23), emotional: Math.sin((2 * Math.PI * elapsedDays) / 28), intellectual: Math.sin((2 * Math.PI * elapsedDays) / 33) };
    }

    function DBSetupModal({ onConfigured }) {
      const [owner, setOwner] = useState("");
      const [repo, setRepo] = useState("AstroGrah");
      const [token, setToken] = useState("");
      const [error, setError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        GitHubDB.setConfig(owner, repo, token);
        try {
          const res = await GitHubDB.callApi('GET', ''); // test repo access
          onConfigured();
        } catch(err) {
          setError("Cannot access repository. Check Owner, Repo name, and Token permissions.");
          localStorage.removeItem('gh_db_config');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
          <form onSubmit={handleSubmit} className="w-full max-w-sm space-y-4 rounded-3xl border border-white/10 bgcard2 p-6">
            <div className="text-center mb-6">
              <Icon name="database" size={32} className="mx-auto text-amber-400 mb-2" />
              <h2 className="font-serif text-2xl t100">Database Setup</h2>
              <p className="text-xs t60 mt-2">To save your profiles and chats securely to your own GitHub repository, configure your connection below.</p>

      const [editingProfile, setEditingProfile] = useState(null);
      const [showSettings, setShowSettings] = useState(false);

      useEffect(() => {
        if (GitHubDB.loadConfig()) setDbConfigured(true);
      }, []);

      if (!dbConfigured) return <DBSetupModal onConfigured={() => setDbConfigured(true)} />;
      if (!user) return <AuthModal onLogin={(email, data) => setUser({ email, data })} />;
      if (user.data.needsPasswordChange) return <ChangePasswordModal email={user.email} onComplete={() => setUser({...user, data: {...user.data, needsPasswordChange: false}})}/>;

      const profiles = user.data.profiles || [];
      const settings = user.data.settings || { aiModel: "gemini-1.5-flash", monthSystem: "amanta", apiKeys: {} };
      
      let activeProfile = profiles.find(p => p.id === activeProfileId);
      if (!activeProfile && profiles.length > 0) activeProfile = profiles[0];

      const activeChart = activeProfile ? computeKundli(activeProfile) : null;

      const handleSaveProfile = async (e) => {
          e.preventDefault(); const form = e.target;
          const profData = {
              name: form.name.value, dob: form.dob.value, time: form.time.value,
              place: form.place.value, lat: parseFloat(form.lat.value), lon: parseFloat(form.lon.value),
              utcOffset: parseFloat(form.utcOffset.value), id: editingProfile.id || Date.now().toString(),
              accent: editingProfile.accent || ACCENT_PALETTE[profiles.length % ACCENT_PALETTE.length]
          };
          
          let newProfiles = [...profiles];
          if(editingProfile.id) {
              const idx = newProfiles.findIndex(p => p.id === editingProfile.id);
              if(idx > -1) newProfiles[idx] = profData;
          } else { newProfiles.push(profData); }

          await GitHubDB.syncUserData(user.email, { profiles: newProfiles });
          setUser({ ...user, data: { ...user.data, profiles: newProfiles } });
          setActiveProfileId(profData.id); setEditingProfile(null);
      };

      const handleUpdateSettings = async (newSettings) => {
          await GitHubDB.syncUserData(user.email, { settings: newSettings });
          setUser({ ...user, data: { ...user.data, settings: newSettings } });
      };

      return (
        <div className="min-h-screen w-full font-sans pb-10" style={{ background: "#14162B" }}>
          <div className="mx-auto max-w-md sm:max-w-2xl px-4 py-6">
            
            <div className="flex items-center justify-between mb-6">
              <div>
                <div className="font-mono fs10 uppercase tr30 t40 mb-1 flex items-center gap-2"><SageLogo size={16}/> Graha Ledger</div>
                {profiles.length > 0 ? (
                  <select value={activeProfile?.id||''} onChange={(e) => setActiveProfileId(e.target.value)} className="bg-transparent font-serif text-2xl text-amber-300 focus:outline-none appearance-none cursor-pointer">
                    {profiles.map(p => <option key={p.id} value={p.id} className="bg-slate-900 text-base">{p.name}</option>)}
                  </select>
                ) : <h1 className="font-serif text-2xl text-amber-300">Welcome</h1>}
              </div>
              <div className="flex gap-2">
                <button onClick={() => setEditingProfile({})} className="p-2 rounded-full border border-white/10 hover:bg-white/5 t70 transition"><Icon name="plus" size={14}/></button>
                <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded-full border border-white/10 hover:bg-white/5 t70 transition"><Icon name="gear" size={14}/></button>
                <button onClick={() => { setUser(null); setActiveProfileId(null); }} className="p-2 rounded-full border border-red-500/30 hover:bg-red-500/20 text-red-400 transition" title="Logout"><Icon name="sign-out" size={14}/></button>
              </div>
            </div>

            {profiles.length === 0 ? (
                <div className="text-center p-8 border border-dashed border-white/20 rounded-3xl mt-10">
                    <SageLogo size={64} className="mx-auto mb-4 opacity-50"/>
                    <h2 className="font-serif text-xl t100">No Profiles Found</h2>
                    <p className="text-sm t50 mt-2 mb-6">Create your first astrology profile to begin generating insights synced securely to your GitHub Repo.</p>
                    <button onClick={() => setEditingProfile({})} className="px-6 py-2.5 rounded-full bg-amber-400 text-black text-sm font-semibold">Create Profile</button>
                </div>
            ) : (
              <>
                <div className="flex justify-between items-center bgfaint3 border border-white/10 p-3 rounded-2xl mb-4">
                   <button onClick={() => setDate(addDays(date, -1))} className="p-1 t50 hover:t100"><Icon name="caret-left" size={18}/></button>
                   <div className="text-center">
                     <div className="text-[10px] font-mono t40 uppercase tracking-widest">{date.toLocaleDateString("en-US", {weekday: 'long'})}</div>
                     <div className="font-serif t100">{date.toLocaleDateString("en-US", {month: 'short', day: 'numeric', year: 'numeric'})}</div>
                   </div>
                   <button onClick={() => setDate(addDays(date, 1))} className="p-1 t50 hover:t100"><Icon name="caret-right" size={18}/></button>
                </div>

                <div className="flex gap-1 overflow-x-auto rounded-xl border border-white/10 bgfaint2 p-1 mb-6">
                  {[{id:"person", label:"Astrology"}, {id:"panchang", label:"Panchang & Time"}, {id:"ask", label:"Ask AI"}].map(t => (
                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex-1 whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium transition ${activeTab === t.id ? "bg-white/10 text-white" : "t50"}`}>{t.label}</button>
                  ))}
                </div>

                {activeTab === "person" && <PersonTab profile={activeProfile} chart={activeChart} date={date} settings={settings} />}
                {activeTab === "panchang" && <PanchangTab date={date} profile={activeProfile} settings={settings} />}
                {activeTab === "ask" && <AskTab email={user.email} userData={user.data} activeProfile={activeProfile} settings={settings} />}
              </>
            )}

            {/* Quick Settings Inline Drawer */}
            {showSettings && (
                <div className="mt-6 p-4 rounded-2xl border border-white/10 bgfaint3 gl-fadein space-y-4">
                    <h3 className="font-serif text-lg mb-1">Vault & Engine Settings</h3>
                    
                    <div>
                        <label className="text-xs t50 block mb-1 uppercase font-mono tracking-wide">Select AI Engine</label>
                        <select value={settings.aiModel} onChange={e => handleUpdateSettings({...settings, aiModel: e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white">
                            {LLM_PROVIDERS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                    </div>

                    <div>
                        <label className="text-xs t50 block mb-1 uppercase font-mono tracking-wide">API Keys Vault</label>
                        <div className="space-y-2">
                           <input placeholder="Gemini API Key" value={settings.apiKeys?.['gemini-1.5-flash']||""} onChange={e => handleUpdateSettings({...settings, apiKeys: {...settings.apiKeys, 'gemini-1.5-flash': e.target.value}})} type="password" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder:t30"/>
                           <input placeholder="OpenAI API Key" value={settings.apiKeys?.['gpt-4o']||""} onChange={e => handleUpdateSettings({...settings, apiKeys: {...settings.apiKeys, 'gpt-4o': e.target.value}})} type="password" className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder:t30"/>
                        </div>
                    </div>
                </div>
            )}
          </div>

          {/* Profile Edit Modal */}
          {editingProfile && (
             <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
               <form onSubmit={handleSaveProfile} className="w-full max-w-sm bgcard2 rounded-3xl border border-white/10 p-5 space-y-3">
                 <div className="flex justify-between items-center mb-2"><h3 className="font-serif text-lg t100">{editingProfile.id ? "Edit Profile" : "New Profile"}</h3><button type="button" onClick={()=>setEditingProfile(null)} className="t50 hover:t100"><Icon name="x" size={16}/></button></div>
                 
                 <div><label className="text-[10px] t40 uppercase font-mono ml-1">Name</label><input required name="name" defaultValue={editingProfile.name||""} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"/></div>
                 <div className="grid grid-cols-2 gap-2">
                    <div><label className="text-[10px] t40 uppercase font-mono ml-1">Date</label><input required type="date" name="dob" defaultValue={editingProfile.dob||"2000-01-01"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"/></div>
                    <div><label className="text-[10px] t40 uppercase font-mono ml-1">Time</label><input required type="time" name="time" defaultValue={editingProfile.time||"12:00"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"/></div>
                 </div>
                 <div><label className="text-[10px] t40 uppercase font-mono ml-1">Location (City)</label><input required name="place" defaultValue={editingProfile.place||"Dubai"} className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"/></div>
                 <div className="grid grid-cols-3 gap-2">
                    <div><label className="text-[10px] t40 uppercase font-mono ml-1">Lat</label><input required type="number" step="any" name="lat" defaultValue={editingProfile.lat||25.2} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm text-white mt-1"/></div>
                    <div><label className="text-[10px] t40 uppercase font-mono ml-1">Lon</label><input required type="number" step="any" name="lon" defaultValue={editingProfile.lon||55.2} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm text-white mt-1"/></div>
                    <div><label className="text-[10px] t40 uppercase font-mono ml-1">UTC</label><input required type="number" step="any" name="utcOffset" defaultValue={editingProfile.utcOffset||4} className="w-full bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-sm text-white mt-1"/></div>
                 </div>
                 
                 <div className="flex justify-between items-center mt-4 pt-4 border-t border-white/10">
                    <button type="submit" className="bg-amber-400 text-black font-semibold text-sm px-5 py-2 rounded-full ml-auto">Save Profile</button>
                 </div>
               </form>
             </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = window.ReactDOM.createRoot(rootElement);
    root.render(<GrahaLedgerContent />);
  </script>
</body>
</html>
