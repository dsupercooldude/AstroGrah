        encrypt: (data) => {
            if (!data) return data;

        decrypt: (b64) => {

    // GitHub DB Adapter

      config: null,

      loadConfig() { const conf = localStorage.getItem('gh_db_config'); if (conf) this.config = JSON.parse(conf); return this.config; },
      async callApi(method, path, body = null) {
        if (!this.config) throw new Error("GitHub DB not configured.");
        const url = `https://api.github.com/repos/${this.config.owner}/${this.config.repo}/contents/${path}`;
        const headers = { 'Authorization': `token ${this.config.token}`, 'Accept': 'application/vnd.github.v3+json' };
        if (body) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
        if (!res.ok && res.status !== 404) throw new Error(`GitHub Error: ${res.statusText}`);
        return res.status === 404 ? null : await res.json();

      async getDB() {

          const db = await this.getDB();

      }

    // Core Math
    function norm360(x) { let v = x % 360; return v < 0 ? v + 360 : v; }
    function toRad(d) { return (d * Math.PI) / 180; }
    function julianDay(dStr, tStr, utc) { const [Y,M,D]=(dStr||"2000-01-01").split("-").map(Number); const [h,m]=(tStr||"12:00").split(":").map(Number); return (Date.UTC(Y,M-1,D,h,m,0) - (utc*3600000)) / 86400000 + 2440587.5; }

    function helio(n, T) {
        const p=PE[n], a=p.a[0], e=p.e[0], i=toRad(p.i[0]), L=p.L[0]+p.L[1]*T, peri=p.peri[0], node=p.node[0];
        const w=toRad(norm360(peri-node)), Om=toRad(norm360(node)), M=toRad(norm360(L-peri));
        const E=M+e*Math.sin(M); const xo=a*(Math.cos(E)-e), yo=a*Math.sqrt(1-e*e)*Math.sin(E);
        const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(Om),so=Math.sin(Om),ci=Math.cos(i);
        return { x: (co*cw-so*sw*ci)*xo + (-co*sw-so*cw*ci)*yo, y: (so*cw+co*sw*ci)*xo + (-so*sw+co*cw*ci)*yo };
    }
    function sunLon(T) { const M = norm360(357.529 + 35999.05*T); const L = norm360(280.466 + 36000.77*T + 1.915*Math.sin(toRad(M))); return {L, R: 1.00014 - 0.01671*Math.cos(toRad(M))}; }
    function moonLon(T) { const D=norm360(297.85+445267.11*T), M=norm360(357.52+35999.05*T), Mp=norm360(134.96+477198.86*T); return norm360(218.316+481267.88*T + 6.28*Math.sin(toRad(Mp)) + 1.27*Math.sin(toRad(2*D-Mp))); }

    function computeKundli(profile, ayType="lahiri", trDate=null) {
        if(!profile) return null;
        const JD = julianDay(profile.dob, profile.time, profile.utcOffset); const T = (JD-2451545)/36525;
        const [Y,Mo] = (profile.dob||"2000-01-01").split("-").map(Number); const aya = getAya(Y+(Mo-1)/12, ayType);
        
        const s = sunLon(T); const e = {x: s.R*Math.cos(toRad(norm360(s.L+180))), y: s.R*Math.sin(toRad(norm360(s.L+180)))};
        const tr = { Sun: s.L, Moon: moonLon(T), Rahu: norm360(125.04-1934.13*T) };
        tr.Ketu = norm360(tr.Rahu+180);
        ["Mercury","Venus","Mars","Jupiter","Saturn"].forEach(p => { const h=helio(p,T); tr[p] = norm360(Math.atan2(h.y-e.y, h.x-e.x)*180/Math.PI); });
        
        const sid = {}; Object.keys(tr).forEach(k => sid[k] = norm360(tr[k]-aya));
        const [hh,mm]=(profile.time||"12:00").split(":").map(Number); const ascL = norm360(tr.Sun + ((hh+mm/60)-6)*15 - aya);
        
        const getDiv = (lon, div) => {
            if(div===1) return SIGNS[Math.floor(lon/30)];
            if(div===9) return SIGNS[ ( [0,9,6,3,0,9,6,3,0,9,6,3][Math.floor(lon/30)] + Math.floor((lon%30)/(30/9)) ) % 12 ];
            if(div===10) return SIGNS[ ( (Math.floor(lon/30)%2!==0 ? Math.floor(lon/30)+8 : Math.floor(lon/30)) + Math.floor((lon%30)/3) ) % 12 ];
        };

        const genC = (div) => {
            const lg=getDiv(ascL,div); const idx=SIGNS.indexOf(lg);
            const hs={}, pl={}; for(let i=1;i<=12;i++) hs[i]=SIGNS[(idx+i-1)%12];
            Object.entries(sid).forEach(([p, l]) => pl[p] = ((SIGNS.indexOf(getDiv(l,div))-idx+12)%12)+1);
            return { lagna: lg, houses: hs, placements: pl };
        };

        const d1=genC(1), d9=genC(9), d10=genC(10);
        const moonIdx = Math.floor(sid.Moon/(360/27));
        
        const stLord = NAK_LORDS[moonIdx%9]; const frac = (sid.Moon%(360/27))/(360/27);
        let cy = Y+(Mo-1)/12; let cIdx = moonIdx%9; const dashas=[];
        dashas.push({ p: stLord, s: cy, e: cy+(VIM_YEARS[stLord]*(1-frac)) }); cy += VIM_YEARS[stLord]*(1-frac); cIdx=(cIdx+1)%9;
        for(let i=0;i<8;i++) { const p=NAK_LORDS[cIdx]; dashas.push({ p, s: cy, e: cy+VIM_YEARS[p] }); cy+=VIM_YEARS[p]; cIdx=(cIdx+1)%9; }

        let transits = null;
        if (trDate) {
            const trJD = julianDay(trDate.toISOString().slice(0,10), "12:00", profile.utcOffset); const trT = (trJD-2451545)/36525;
            const ts = sunLon(trT); const te = {x: ts.R*Math.cos(toRad(norm360(ts.L+180))), y: ts.R*Math.sin(toRad(norm360(ts.L+180)))};
            transits = {
                Sun: SIGNS[Math.floor(norm360(ts.L-aya)/30)], Moon: SIGNS[Math.floor(norm360(moonLon(trT)-aya)/30)],
                Jupiter: SIGNS[Math.floor(norm360(Math.atan2(helio('Jupiter',trT).y-te.y, helio('Jupiter',trT).x-te.x)*180/Math.PI-aya)/30)],
                Saturn: SIGNS[Math.floor(norm360(Math.atan2(helio('Saturn',trT).y-te.y, helio('Saturn',trT).x-te.x)*180/Math.PI-aya)/30)]
            };
        }

    function panchang(dObj, ms="amanta", utc=5.5, lat=28.6, lon=77.2) {
        const iso = dObj.toISOString().slice(0,10); const JD = julianDay(iso, "12:00", utc); const T = (JD-2451545)/36525;

        return {

            karana: kIdx===0?"Kimstughna":kIdx<57?KARANAS[(kIdx-1)%7]:["Shakuni","Chatushpada","Naga"][kIdx-57],
            sr, ss, mr, msr, abh, chog, horas, rahu: getS(sr.getTime()+dMs*0.8, dMs*0.1)
        };
    }

    function bio(dob, td, utc) {
        const [Y,M,D]=(dob||"2000-01-01").split("-").map(Number);
        const eD = (Date.UTC(td.getFullYear(),td.getMonth(),td.getDate(),12,0,0)-(utc*3600000) - (Date.UTC(Y,M-1,D,12,0,0)-(utc*3600000))) / 86400000;
        return { p: Math.sin(2*Math.PI*eD/23), e: Math.sin(2*Math.PI*eD/28), i: Math.sin(2*Math.PI*eD/33) };
    }

                <form onSubmit={ask} className="flex gap-2 p-2 bgfaint3 border border-white/10 rounded-xl">
                    <button type="button" onClick={()=>alert("Web Speech API active. Please speak.")} className="p-2 t50 hover:t100"><Icon name="microphone" size={18}/></button>
                    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Ask about timing, career..." className="flex-1 bg-transparent text-sm focus:outline-none"/>
                    <button type="submit" disabled={l} className="px-4 py-2 bg-amber-400 text-black text-sm font-semibold rounded-lg disabled:opacity-50">Ask</button>
                </form>
            </div>
        );
    }

    // Main Shell
    function AppContent() {
        const [dbC, setDbC]=useState(false); const [u, setU]=useState(null); const [tb, setTb]=useState("person");
        const [dt, setDt]=useState(new Date("2026-08-20T12:00:00")); const [ss, setSs]=useState(false); const [ed, setEd]=useState(null);
        const [ex, setEx]=useState(false);
        useEffect(()=>{ if(GitHubDB.loadConfig()) setDbC(true); },[]);
        if(!dbC) return <SetupModal onConfig={()=>setDbC(true)}/>;
        if(!u) return <AuthModal onLogin={(e,d)=>setU({e,d})}/>;

        const prs = u.d.profiles||[]; const set = u.d.settings||{aiModel:"offline", apiKeys:{}};
        const chs = useMemo(()=>{ const o={}; prs.forEach(p=>o[p.id]=computeKundli(p, 'lahiri', dt)); return o; },[prs,dt]);
        const aP = prs[0]||null;

        const hSave = async(e) => {
            e.preventDefault(); const f=e.target;
            const pD = { name: f.nm.value, dob: f.dob.value, time: f.tm.value, place: f.pl.value, lat: parseFloat(f.lt.value), lon: parseFloat(f.ln.value), utcOffset: parseFloat(f.ut.value), gotra: f.gt.value, jaati: f.jt.value, kulDevta: f.kd.value, gramDevta: f.gd.value, id: ed.id||Date.now().toString(), accent: ed.accent||"#D4A574" };
            const nP = ed.id ? prs.map(p=>p.id===pD.id?pD:p) : [...prs, pD];
            await GitHubDB.syncUserData(u.e, {...u.d, profiles:nP}); setU({...u, d:{...u.d, profiles:nP}}); setEd(null);
        };

        return (
            <div className="min-h-screen w-full font-sans pb-10" style={{background:"#14162B", paddingTop:'40px'}}>
                <div className="mx-auto max-w-md sm:max-w-2xl px-4 py-6">
                    <div className="flex justify-between mb-6"><div className="flex items-center gap-2"><SageLogo size={24}/><h1 className="font-serif text-xl text-amber-300">Graha Ledger</h1></div><div className="flex gap-2"><button onClick={()=>setEd({})} className="p-2 rounded-full border border-white/10 hover:bg-white/5"><Icon name="user-plus"/></button><button onClick={()=>setSs(!ss)} className="p-2 rounded-full border border-white/10 hover:bg-white/5 z-50 relative"><Icon name="gear"/></button></div></div>
                    {prs.length===0 ? (
                        <div className="text-center p-8 border border-dashed border-white/20 rounded-3xl mt-10"><h2 className="font-serif text-xl mb-2">Welcome</h2><p className="text-sm t50 mb-6">Create a profile to begin.</p><button onClick={()=>setEd({})} className="px-6 py-2.5 rounded-full bg-amber-400 text-black text-sm font-semibold">Create Profile</button></div>
                    ) : (
                        <>
                            <div className="flex gap-1 overflow-x-auto rounded-xl border border-white/10 bgfaint2 p-1 mb-6 font-mono text-xs">{[{id:"person",l:"Astrology"},{id:"panchang",l:"Panchang"},{id:"union",l:"Union"},{id:"ask",l:"Ask AI"}].map(t=><button key={t.id} onClick={()=>setTb(t.id)} className={`flex-1 whitespace-nowrap rounded-lg px-3 py-2 ${tb===t.id?"bg-white/15 t100":"t50"}`}>{t.l}</button>)}</div>
                            {tb==="person" && <PersonTab pr={aP} ch={chs[aP.id]} date={dt} setDate={setDt} ex={ex} setEx={setEx}/>}
                            {tb==="panchang" && <PanchangTab d={dt} p={aP} utc={aP.utcOffset}/>}
                            {tb==="union" && <CompatTab prs={prs} chs={chs}/>}
                            {tb==="ask" && <AskTab em={u.e} set={set} pr={aP}/>}
                        </>
                    )}

                    {ss && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4" onClick={()=>setSs(false)}>
                            <div onClick={e=>e.stopPropagation()} className="w-full max-w-sm p-5 rounded-3xl border border-white/10 bgcard2 space-y-4 max-h-[85vh] overflow-y-auto gl-fadein">
                                <div className="flex justify-between items-center"><h3 className="font-serif text-lg">Settings Vault</h3><button onClick={()=>setSs(false)}><Icon name="x"/></button></div>
                                <div><label className="fs10 font-mono uppercase t50 mb-1 block">AI Engine</label><select value={set.aiModel} onChange={e=>{const s={...set,aiModel:e.target.value}; GitHubDB.syncUserData(u.e,{...u.d,settings:s}); setU({...u,d:{...u.d,settings:s}});}} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm">{LLM_PROVIDERS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                                <div className="p-3 border border-amber-400/20 bg-amber-400/5 rounded-xl space-y-2">
                                    <label className="fs10 text-amber-300 font-mono uppercase flex items-center justify-between">Encrypted API Keys <a href="https://aistudio.google.com/app/apikey" target="_blank" className="hover:text-white" title="Get API Key"><Icon name="question"/></a></label>
                                    {LLM_PROVIDERS.filter(p=>p.id!=='offline').map(p=><div key={p.id}><div className="flex justify-between fs9 t50 mb-0.5"><span>{p.name}</span><a href={`https://${p.url}`} target="_blank" className="text-amber-400">Get Key</a></div><input type="password" value={set.apiKeys?.[p.id]||""} onChange={e=>{const s={...set,apiKeys:{...set.apiKeys,[p.id]:e.target.value}}; GitHubDB.syncUserData(u.e,{...u.d,settings:s}); setU({...u,d:{...u.d,settings:s}});}} className="w-full bg-black/40 border border-white/10 rounded px-2 py-1.5 text-xs"/></div>)}
                                </div>
                            </div>
                        </div>
                    )}

                    {ed && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/80 p-4">
                            <form onSubmit={hSave} className="w-full max-w-sm bgcard2 rounded-3xl border border-white/10 p-5 space-y-3 max-h-[90vh] overflow-y-auto gl-fadein">
                                <div className="flex justify-between"><h3 className="font-serif text-lg">{ed.id?"Edit Profile":"New Profile"}</h3><button type="button" onClick={()=>setEd(null)}><Icon name="x"/></button></div>
                                <div><label className="fs10 t40 uppercase font-mono">Full Name</label><input required name="nm" defaultValue={ed.name||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div>
                                <div className="grid grid-cols-2 gap-2"><div><label className="fs10 t40 uppercase font-mono">Date</label><input required type="date" name="dob" defaultValue={ed.dob||"2000-01-01"} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div><div><label className="fs10 t40 uppercase font-mono">Time</label><input required type="time" name="tm" defaultValue={ed.time||"12:00"} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div></div>
                                <div><label className="fs10 t40 uppercase font-mono">Quick Location Autofill</label><select onChange={e=>{const p=CITY_PRESETS.find(c=>c.name===e.target.value); if(p){e.target.form.pl.value=p.name; e.target.form.lt.value=p.lat; e.target.form.ln.value=p.lon; e.target.form.ut.value=p.utc;}}} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"><option value="">- Select -</option>{CITY_PRESETS.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}</select></div>
                                <div><label className="fs10 t40 uppercase font-mono">Place Name</label><input required name="pl" defaultValue={ed.place||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div>
                                <div className="grid grid-cols-3 gap-2"><div><label className="fs10 t40 uppercase font-mono">Lat</label><input required type="number" step="any" name="lt" defaultValue={ed.lat||""} className="w-full bg-black/40 border border-white/10 rounded px-2 py-2 text-sm"/></div><div><label className="fs10 t40 uppercase font-mono">Lon</label><input required type="number" step="any" name="ln" defaultValue={ed.lon||""} className="w-full bg-black/40 border border-white/10 rounded px-2 py-2 text-sm"/></div><div><label className="fs10 t40 uppercase font-mono">UTC</label><input required type="number" step="any" name="ut" defaultValue={ed.utcOffset||""} className="w-full bg-black/40 border border-white/10 rounded px-2 py-2 text-sm"/></div></div>
                                <div className="grid grid-cols-2 gap-2 pt-2 border-t border-white/10"><div><label className="fs10 t40 uppercase font-mono">Gotra</label><input name="gt" defaultValue={ed.gotra||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div><div><label className="fs10 t40 uppercase font-mono">Jaati / Varg</label><input name="jt" defaultValue={ed.jaati||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div></div>
                                <div className="grid grid-cols-2 gap-2"><div><label className="fs10 t40 uppercase font-mono">Kul Devta</label><input name="kd" defaultValue={ed.kulDevta||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div><div><label className="fs10 t40 uppercase font-mono">Gram Devta</label><input name="gd" defaultValue={ed.gramDevta||""} className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-sm"/></div></div>
                                <button type="submit" className="w-full bg-amber-400 text-black font-semibold rounded-full py-2.5 mt-2">Save Profile</button>
                            </form>
                        </div>
                    )}
                </div>
            </div>
        );
    }
    const root = window.ReactDOM.createRoot(document.getElementById('root')); root.render(<AppContent/>);
  </script>
</body>
</html>
