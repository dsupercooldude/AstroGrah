  <div id="bootloader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;"><div style="background: #1C1F3D; border: 1px solid rgba(212,165,116,0.3); padding: 30px; border-radius: 24px; max-width: 400px;"><h2 style="font-family: serif; color: #D4A574; font-size: 24px; margin-bottom: 10px;">Graha Ledger Loading...</h2><p style="color: rgba(255,255,255,0.6); font-size: 12px; margin-bottom: 20px;">Fetching modular fabric components...</p><button onclick="localStorage.clear(); window.location.reload();" style="background: #D4A574; color: #121426; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;">Hard Reset Cache</button></div></div>

  <script type="text/javascript">
    function googleTranslateElementInit() { new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element'); }
    function triggerGoogleTranslate(langCode) { var sel = document.querySelector('.goog-te-combo'); if (sel) { sel.value = langCode; sel.dispatchEvent(new Event('change')); } else { setTimeout(() => triggerGoogleTranslate(langCode), 500); } }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
